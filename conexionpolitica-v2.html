<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Conexión · Crónica en directo · Periodismo Político</title>
<style>
  :root {
    --red:#C8102E;--dark:#1B1B1F;--ink:#2B2B30;
    --paper:#fff;--tint:#FBF1F2;--gold:#E8B54A;
    --muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--bg:#F5F5F7;--panel:#2A2A30;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .topbar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:56px;gap:10px;flex-wrap:wrap}
  .topbar-left{display:flex;flex-direction:column;justify-content:center}
  .topbar-title{font-size:15px;font-weight:700;letter-spacing:.03em}
  .topbar-sub{font-size:10px;color:var(--gold);letter-spacing:.06em}
  .topbar-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .tbtn:hover{background:rgba(255,255,255,.22)}
  .tbtn-gold{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:700}
  .tbtn-red{background:var(--red);border-color:var(--red);font-weight:700}

  .stage{max-width:720px;margin:0 auto;padding:26px 16px 60px;display:flex;flex-direction:column;gap:18px;align-items:center}

  .panel{background:#fff;border-radius:14px;border:1px solid var(--border);width:100%;overflow:hidden}
  .panel-head{background:var(--dark);color:#fff;padding:11px 18px;font-size:12px;font-weight:700;letter-spacing:.06em}
  .panel-body{padding:22px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;font-size:14.5px;font-family:inherit;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--red)}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}

  .big-btn{border:none;padding:20px 40px;border-radius:16px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:var(--red);transition:transform .12s,opacity .15s;letter-spacing:.02em}
  .big-btn:hover{opacity:.9}
  .big-btn:active{transform:scale(.97)}
  .big-btn:disabled{opacity:.4;cursor:not-allowed}
  .big-btn.gold{background:var(--gold);color:var(--dark)}
  .big-btn.dark{background:var(--dark)}

  .status-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.05em}
  .status-badge.idle{background:var(--bg);color:var(--muted)}
  .status-badge.live{background:var(--red);color:#fff}
  .status-badge.playing{background:var(--gold);color:var(--dark)}
  .status-badge.done{background:var(--green);color:#fff}

  .stage-center{text-align:center;width:100%}
  .stage-center .icon{font-size:56px;margin-bottom:6px}
  .stage-center h2{font-size:20px;font-weight:700;margin:8px 0 6px}
  .stage-center p{font-size:14px;color:var(--muted);line-height:1.6;max-width:480px;margin:0 auto}

  /* TIMER */
  .timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
  .timer-circle{position:relative;width:220px;height:220px}
  .timer-circle svg{transform:rotate(-90deg)}
  .timer-ring-bg{fill:none;stroke:var(--bg);stroke-width:14}
  .timer-ring{fill:none;stroke:var(--red);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
  .timer-ring.warn{stroke:var(--gold)}
  .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--ink)}
  .rec-pulse{width:14px;height:14px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .warn-banner{background:var(--gold);color:var(--dark);font-weight:700;border-radius:10px;padding:12px 18px;font-size:15px;display:none;animation:flash 1s infinite}
  .warn-banner.show{display:block}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .btn{border:none;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-outline{background:#fff;border:2px solid var(--border);color:var(--ink)}
  .btn-outline:hover{border-color:var(--red);color:var(--red)}
  .btn-dark{background:var(--dark);color:#fff}

  audio{width:100%;margin:14px 0}

  .waveform-note{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

  #toastWrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw)}
  .toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;text-align:center;line-height:1.4}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.warn{background:var(--red)}

  /* VISTAS Y CORTES */
  .tbtn.on{background:#fff;color:var(--dark);border-color:#fff}
  .tbtn:disabled{opacity:.35;cursor:not-allowed}
  .corte-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .corte-item{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
  .corte-item .cn{flex:1;font-weight:700;font-size:14px;word-break:break-word}
  .corte-item .cd{font-size:12px;color:var(--muted);white-space:nowrap}
  .mini{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  .mini:hover{border-color:var(--red);color:var(--red)}
  .mini.del{color:var(--red)}
  .live-cortes{margin-top:16px;border-top:2px solid var(--bg);padding-top:14px}
  .live-cortes h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;text-align:center}
  .corte-btn{display:block;width:100%;text-align:left;border:2px solid var(--gold);background:#FFF8E8;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--dark);margin-bottom:8px}
  .corte-btn small{font-weight:400;color:var(--muted);margin-left:6px}
  .corte-btn:disabled{opacity:.4;cursor:not-allowed}
  .corte-btn.playing{background:var(--gold);animation:flash 1s infinite}
  .ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:10px 0}
  .marks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .mark{border:2px solid var(--border);border-radius:10px;padding:10px;text-align:center}
  .mark b{display:block;font-size:22px;margin:4px 0;font-variant-numeric:tabular-nums}
  .mark .lbl{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  .mark .nudge{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .progress{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}
  .progress div{height:100%;background:var(--red);width:0}
  .note{background:var(--tint);border-left:4px solid var(--red);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.5;margin:10px 0;color:var(--ink)}
  .sep{height:1px;background:var(--border);margin:18px 0}
  .field input[type=file]{padding:9px;background:var(--bg)}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}
  .rec-live{text-align:center;font-weight:700;color:var(--red);margin:10px 0}
</style>
<script>
/* ── Guardar archivos también en iPhone, iPad y Mac ── */
(function(){
  var ua = navigator.userAgent;
  var esIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var esSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);
  var esApple = esIOS || esSafari;
  function directa(blob, nombre){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  function compartir(blob, nombre){
    try{
      var f = new File([blob], nombre, {type: blob.type || 'application/octet-stream'});
      if(esIOS && navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).catch(function(e){ if(!e || e.name !== 'AbortError') directa(blob, nombre); });
        return;
      }
    }catch(e){}
    directa(blob, nombre);
  }
  window.guardarArchivo = function(blob, nombre){
    if(!esApple){ directa(blob, nombre); return; }
    // En Apple pedimos un toque más: así Safari nunca bloquea la descarga
    var viejo = document.getElementById('gaCapa'); if(viejo) viejo.remove();
    var capa = document.createElement('div');
    capa.id = 'gaCapa';
    capa.setAttribute('style','position:fixed;inset:0;background:rgba(20,20,24,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,Helvetica,sans-serif');
    capa.innerHTML =
      '<div style="background:#fff;color:#1B1B1F;border-radius:16px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)">' +
      '<div style="font-size:40px;margin-bottom:6px">📥</div>' +
      '<div style="font-size:19px;font-weight:800;margin-bottom:6px">Vuestro archivo está listo</div>' +
      '<div style="font-size:13px;color:#6B6B72;margin-bottom:16px;word-break:break-all">' + String(nombre).replace(/</g,'&lt;') + '</div>' +
      '<button id="gaSi" style="display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;background:#C8102E;color:#fff;cursor:pointer">Guardar archivo</button>' +
      (esIOS ? '<div style="font-size:12.5px;color:#6B6B72;margin-top:10px;line-height:1.45">En el menú que se abre, elegid <b>«Guardar en Archivos»</b>. También podéis mandarlo por correo o AirDrop.</div>' : '') +
      '<button id="gaNo" style="margin-top:12px;border:0;background:none;color:#6B6B72;font-size:14px;cursor:pointer;text-decoration:underline">Cerrar</button>' +
      '</div>';
    document.body.appendChild(capa);
    document.getElementById('gaSi').onclick = function(){ compartir(blob, nombre); setTimeout(function(){ capa.remove(); }, 400); };
    document.getElementById('gaNo').onclick = function(){ capa.remove(); };
  };
})();
</script>

const TOTAL_CIRC = 2 * Math.PI * 100;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function toast(msg, warn){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (warn ? ' warn' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3600);
}
function setStatus(text, cls){
  const b = document.getElementById('statusBadge');
  b.textContent = text;
  b.className = 'status-badge ' + cls;
}
function fmt(t){
  t = Math.max(0, t || 0);
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  const ss = s.toFixed(1).padStart(4,'0');
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + ss;
}
function fmtShort(t){
  t = Math.round(t || 0);
  return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
}

// ================= ALMACÉN (IndexedDB) =================
const DB_NAME = 'conexion-politica-cortes', STORE = 'items';
let dbPromise = null;
function db(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    try{
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath:'id'});
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbPromise;
}
async function dbTx(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(STORE, mode);
    const st = tx.objectStore(STORE);
    const req = fn(st);
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbAll(){ try{ return await dbTx('readonly', st => st.getAll()) || []; }catch(e){ return []; } }
async function dbPut(o){ try{ await dbTx('readwrite', st => st.put(o)); return true; }catch(e){ return false; } }
async function dbDel(id){ try{ await dbTx('readwrite', st => st.delete(id)); }catch(e){} }

async function loadStore(){
  const all = await dbAll();
  cortes = all.filter(x => x.kind === 'corte').sort((a,b) => a.created - b.created);
  const e = all.find(x => x.id === '__entrada');
  entradaCustom = e || null;
  render();
}

function base64ToArrayBuffer(b64str){
  const binary = atob(b64str);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
async function buildIntroBuffer(){
  const ctx = getCtx();
  if(entradaCustom && entradaCustom.blob){
    try{ return await ctx.decodeAudioData(await entradaCustom.blob.arrayBuffer()); }catch(e){}
  }
  return await ctx.decodeAudioData(base64ToArrayBuffer(INTRO_AUDIO_B64));
}

function brass(ctx, dest, freq, t0, d, gainVal){
  const osc = ctx.createOscillator();
  const filt = ctx.createBiquadFilter();
  const g = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  filt.type = 'lowpass'; filt.frequency.value = 2200; filt.Q.value = 0.7;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gainVal, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  osc.connect(filt); filt.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + d + 0.05);
}

// Sintonía de salida sintetizada: cierra la conexión y devuelve a estudio.
async function buildOutroBuffer(){
  const sr = 44100, dur = 6.5;
  const ctx = new OfflineAudioContext(2, Math.ceil(dur*sr), sr);
  const master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(ctx.destination);
  const notes = [783.99, 659.25, 523.25, 392.00];
  notes.forEach((f, i) => brass(ctx, master, f, 0.15 + i*0.30, 1.0, 0.28));
  const chordStart = 0.15 + notes.length*0.30 + 0.2;
  [392.00, 523.25, 659.25, 783.99, 987.77].forEach(f => brass(ctx, master, f, chordStart, 2.8, 0.16));
  const pipT = chordStart + 2.8 - 0.35;
  const posc = ctx.createOscillator(), pg = ctx.createGain();
  posc.type = 'sine'; posc.frequency.value = 1000;
  pg.gain.setValueAtTime(0, pipT);
  pg.gain.linearRampToValueAtTime(0.4, pipT+0.01);
  pg.gain.setValueAtTime(0.4, pipT+0.18);
  pg.gain.linearRampToValueAtTime(0, pipT+0.22);
  posc.connect(pg); pg.connect(master);
  posc.start(pipT); posc.stop(pipT+0.24);
  return await ctx.startRendering();
}

// Nueva entrada: sintonía de apertura (opcional) + voz grabada o subida.
async function mixEntrada(voiceBuf, conSintonia){
  const sr = 44100;
  const voiceAt = conSintonia ? 2.4 : 0.2;
  const total = voiceAt + voiceBuf.duration + 0.4;
  const ctx = new OfflineAudioContext(2, Math.ceil(total*sr), sr);
  if(conSintonia){
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.8, 0);
    master.gain.setValueAtTime(0.8, voiceAt - 0.3);
    master.gain.linearRampToValueAtTime(0.18, voiceAt + 0.2);
    master.connect(ctx.destination);
    [392.00, 523.25, 659.25, 783.99].forEach((f, i) => brass(ctx, master, f, 0.1 + i*0.22, 0.9, 0.28));
    [392.00, 523.25, 659.25, 783.99, 987.77].forEach(f => brass(ctx, master, f, 1.1, 2.6, 0.15));
  }
  const src = ctx.createBufferSource();
  src.buffer = voiceBuf; src.connect(ctx.destination); src.start(voiceAt);
  return await ctx.startRendering();
}

function playBufferLive(buffer){
  return new Promise(resolve => {
    const ctx = getCtx();
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.onended = resolve;
    src.start();
  });
}

// ================= WAV =================
function audioBufferToWav(buffer){
  const numCh = buffer.numberOfChannels, sr = buffer.sampleRate;
  const blockAlign = numCh * 2;
  const dataLength = buffer.length * blockAlign;
  const arr = new ArrayBuffer(44 + dataLength);
  const view = new DataView(arr);
  const writeStr = (o, s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, 36+dataLength, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sr,true);
  view.setUint32(28, sr*blockAlign, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34,16,true); writeStr(36,'data'); view.setUint32(40, dataLength, true);
  const channels = [];
  for(let c=0;c<numCh;c++) channels.push(buffer.getChannelData(c));
  let offset = 44;
  for(let i=0;i<buffer.length;i++){
    for(let c=0;c<numCh;c++){
      let s = Math.max(-1, Math.min(1, channels[c][i]));
      view.setInt16(offset, s < 0 ? s*0x8000 : s*0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([view], {type:'audio/wav'});
}
// Pasa a mono con la frecuencia indicada (para guardar cortes y entradas ligeros).
async function toMono(buf, sr){
  sr = sr || 44100;
  const len = Math.max(1, Math.ceil(buf.duration * sr));
  const ctx = new OfflineAudioContext(1, len, sr);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination); src.start(0);
  return await ctx.startRendering();
}
function sliceBuffer(buf, t0, t1){
  const sr = buf.sampleRate;
  const a = Math.max(0, Math.floor(t0*sr)), b = Math.min(buf.length, Math.ceil(t1*sr));
  const len = Math.max(1, b - a);
  const out = new AudioBuffer({length:len, numberOfChannels:buf.numberOfChannels, sampleRate:sr});
  for(let c=0;c<buf.numberOfChannels;c++) out.copyToChannel(buf.getChannelData(c).subarray(a, a+len), c);
  return out;
}
function pickMime(){
  for(const c of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}
function newRecorder(stream){
  const m = pickMime();
  try{ return m ? new MediaRecorder(stream, {mimeType:m}) : new MediaRecorder(stream); }
  catch(e){ return new MediaRecorder(stream); }
}

}

async function ensureMic(){
  if(micStream && micStream.active) return true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    return true;
  }catch(e){
    toast('No se ha podido acceder al micrófono. Revisa el permiso del navegador.', true);
    return false;
  }
}

async function prepareCortes(){
  const ctx = getCtx();
  for(const c of cortes){
    if(corteBuffers[c.id]) continue;
    try{ corteBuffers[c.id] = await ctx.decodeAudioData(await c.blob.arrayBuffer()); }
    catch(e){ toast('No se ha podido cargar el corte «' + c.name + '».', true); }
  }
}

async function goReady(){
  phase = 'ready';

  setStatus('PIDIENDO PERMISO DEL MICRÓFONO...', 'idle');
  getCtx();

  await prepareCortes();
  setStatus(ok ? 'MICRÓFONO LISTO · A EMITIR' : 'SIN MICRÓFONO — REVISA EL PERMISO', ok ? 'idle' : 'live');
}

async function startEmission(){
  setStatus('PREPARANDO EL MICRÓFONO...', 'idle');
  getCtx();
  if(!(await ensureMic())){ phase = 'error'; render(); return; }
  phase = 'intro';
  render();
  setStatus('SINTONÍA Y PASO DESDE ESTUDIO...', 'playing');
  try{
    introBuffer = await buildIntroBuffer();
    if(!outroBuffer) outroBuffer = await buildOutroBuffer();
    await prepareCortes();
  }catch(e){
    toast('No se han podido preparar los audios en este navegador.', true);
    phase = 'config'; render(); return;
  }
  await playBufferLive(introBuffer);
  await goLiveAndRecord();
}

async function goLiveAndRecord(){
  if(!(await ensureMic())){ phase = 'error'; render(); return; }
  recordedChunks = [];
  corteEvents = [];
  playingCorte = null;
  mediaRecorder = newRecorder(micStream);
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.start();
  recStartPerf = performance.now();

  phase = 'recording';
  timeLeft = durationSec;
  showWarn = false;
  render();
  setStatus('EN DIRECTO', 'live');

  timerInterval = setInterval(() => {
    timeLeft--;
    if(timeLeft <= warnAt && timeLeft > 0) showWarn = true;
    if(timeLeft <= 0){ timeLeft = 0; stopRecording(); }
    renderTimerOnly();
  }, 1000);
}

// Lanzar un corte en directo: suena por los altavoces y queda montado en la crónica.
function fireCorte(id){
  if(phase !== 'recording') return;
  if(playingCorte){ stopCorte(); return; }
  const buf = corteBuffers[id];
  if(!buf){ toast('Este corte no está cargado.', true); return; }
  const ctx = getCtx();
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination);
  const ev = {id, start:(performance.now() - recStartPerf)/1000, dur:buf.duration};
  corteEvents.push(ev);
  playingCorte = {id, src, startPerf:performance.now(), ev};
  src.onended = () => { if(playingCorte && playingCorte.src === src){ playingCorte = null; renderLiveCortes(); } };
  src.start();
  renderLiveCortes();
}
function stopCorte(){
  if(!playingCorte) return;
  const p = playingCorte;
  p.ev.dur = Math.min(p.ev.dur, (performance.now() - p.startPerf)/1000);
  playingCorte = null;
  try{ p.src.stop(); }catch(e){}
  renderLiveCortes();
}

async function stopRecording(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  if(!mediaRecorder || mediaRecorder.state === 'inactive') return;
  if(playingCorte) stopCorte();

  phase = 'mixing';
  render();
  setStatus('MONTANDO LA CRÓNICA...', 'playing');

  const stopped = new Promise(r => { mediaRecorder.onstop = r; });
  mediaRecorder.stop();
  await stopped;

  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }

  try{
    const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
    recordedBuffer = await getCtx().decodeAudioData(await blob.arrayBuffer());
  }catch(e){
    toast('No se ha podido procesar la grabación. Repetid la conexión.', true);
    phase = 'ready'; render(); setStatus('LISTO PARA EMITIR','idle'); return;
  }

  phase = 'outro';
  render();
  setStatus('VUELTA A ESTUDIO...', 'playing');
  await playBufferLive(outroBuffer);
  await mixFinal();
}

async function mixFinal(){
  phase = 'mixing';
  render();
  setStatus('MONTANDO LA CRÓNICA...', 'playing');

  const sr = 44100;
  const evs = corteEvents.filter(e => corteBuffers[e.id] && e.dur > 0.05).sort((a,b) => a.start - b.start);
  const recLen = Math.max(recordedBuffer.duration, ...evs.map(e => e.start + e.dur), 0);
  const T0 = introBuffer.duration;
  const total = T0 + recLen + outroBuffer.duration;
  const offline = new OfflineAudioContext(2, Math.ceil(total*sr), sr);

  const intro = offline.createBufferSource();
  intro.buffer = introBuffer; intro.connect(offline.destination); intro.start(0);

  // Voz del reportero: se silencia mientras suena cada corte.
  const mic = offline.createBufferSource();
  const g = offline.createGain();
  mic.buffer = recordedBuffer; mic.connect(g); g.connect(offline.destination);
  g.gain.setValueAtTime(1, 0);
  const F = 0.04;
  evs.forEach(e => {
    const a = T0 + e.start, b = a + e.dur;
    g.gain.setValueAtTime(1, Math.max(0, a - F));
    g.gain.linearRampToValueAtTime(0, a);
    g.gain.setValueAtTime(0, b);
    g.gain.linearRampToValueAtTime(1, b + F);
  });
  mic.start(T0);

  evs.forEach(e => {
    const s = offline.createBufferSource();
    s.buffer = corteBuffers[e.id]; s.connect(offline.destination);
    s.start(T0 + e.start, 0, e.dur);
  });

  const outro = offline.createBufferSource();
  outro.buffer = outroBuffer; outro.connect(offline.destination); outro.start(T0 + recLen);

  const finalBuffer = await offline.startRendering();
  finalBlob = audioBufferToWav(finalBuffer);
  if(finalBlobUrl) URL.revokeObjectURL(finalBlobUrl);
  finalBlobUrl = URL.createObjectURL(finalBlob);

  phase = 'done';
  render();
  setStatus('CRÓNICA LISTA', 'done');
  toast('🎙 Crónica montada y lista para descargar.');
}

function resetAll(){
  const btn = document.getElementById('resetBtn');
  if(!resetArmed){
    resetArmed = true;
    btn.textContent = '⚠ ¿Seguro? Pulsa otra vez';

    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = '↺ Nueva conexión'; }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  btn.textContent = '↺ Nueva conexión';

  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  if(playingCorte) stopCorte();
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){ try{ mediaRecorder.stop(); }catch(e){} }
  recordedChunks = [];
  recordedBuffer = null;
  corteEvents = [];
  if(finalBlobUrl){ URL.revokeObjectURL(finalBlobUrl); finalBlobUrl = null; }
  finalBlob = null;
  reporteroLabel = '';
  timeLeft = durationSec;
  showWarn = false;
  phase = 'config';
  render();
  setStatus('LISTO PARA CONFIGURAR', 'idle');
}

// ================= EDITOR DE CORTES =================
let ed = {file:null, url:null, el:null, inT:null, outT:null, busy:false, src:null, dest:null, stopAt:null, watch:null};

function edPause(){ if(ed.el){ try{ ed.el.pause(); }catch(e){} } }

function edLoadFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  edPause();
  if(ed.url) URL.revokeObjectURL(ed.url);
  ed = {file:f, url:URL.createObjectURL(f), el:null, inT:null, outT:null, busy:false, src:null, dest:null, stopAt:null, watch:null};
  render();
}
function edMount(){
  const holder = document.getElementById('edPlayer');
  if(!holder || !ed.url) return;
  if(!ed.el){
    ed.el = document.createElement('audio');
    ed.el.controls = true;
    ed.el.preload = 'metadata';
    ed.el.src = ed.url;
    ed.el.addEventListener('loadedmetadata', edInfo);
    ed.el.addEventListener('timeupdate', edTime);
    ed.el.addEventListener('error', () => toast('Este archivo no se puede reproducir en este navegador. Prueba con MP3, M4A o WAV.', true));
  }
  holder.appendChild(ed.el);
  edInfo(); edTime(); edMarks();
}
function edInfo(){
  const i = document.getElementById('edInfo');
  if(i && ed.el && isFinite(ed.el.duration)) i.textContent = ed.file.name + ' · ' + fmt(ed.el.duration).replace(/\.\d$/,'');
}
function edTime(){
  const t = document.getElementById('edNow');
  if(t && ed.el) t.textContent = fmt(ed.el.currentTime);
  if(ed.stopAt != null && ed.el && ed.el.currentTime >= ed.stopAt && !ed.busy){ ed.el.pause(); ed.stopAt = null; }
}
function edSkip(d){
  if(!ed.el) return;
  const dur = isFinite(ed.el.duration) ? ed.el.duration : 1e9;
  ed.el.currentTime = Math.min(dur, Math.max(0, ed.el.currentTime + d));
  edTime();
}
function edToggle(){ if(!ed.el) return; ed.stopAt = null; if(ed.el.paused) ed.el.play(); else ed.el.pause(); }
function edGoto(){
  const v = (document.getElementById('edGo').value || '').trim();
  if(!v || !ed.el) return;
  const p = v.split(':').map(Number);
  if(p.some(isNaN)){ toast('Escribe el tiempo como 1:23:45, 23:45 o 45.', true); return; }
  let t = 0; p.forEach(n => t = t*60 + n);
  const dur = isFinite(ed.el.duration) ? ed.el.duration : t;
  ed.el.currentTime = Math.min(t, dur);
  edTime();
}
function edMark(which){
  if(!ed.el) return;
  const t = ed.el.currentTime;
  if(which === 'in') ed.inT = t; else ed.outT = t;
  if(ed.inT != null && ed.outT != null && ed.outT <= ed.inT){
    if(which === 'in') ed.outT = null; else ed.inT = null;
    toast('El final tiene que ir después del inicio.', true);
  }
  edMarks();
}
function edNudge(which, d){
  if(!ed.el) return;
  const dur = isFinite(ed.el.duration) ? ed.el.duration : 1e9;
  if(which === 'in' && ed.inT != null){ ed.inT = Math.min(dur, Math.max(0, ed.inT + d)); ed.el.currentTime = ed.inT; }
  if(which === 'out' && ed.outT != null){ ed.outT = Math.min(dur, Math.max(0, ed.outT + d)); ed.el.currentTime = Math.max(0, ed.outT - 2); }
  if(ed.inT != null && ed.outT != null && ed.outT <= ed.inT + 0.1){ toast('El final tiene que ir después del inicio.', true); }
  edMarks();
}
function edMarks(){
  const a = document.getElementById('edIn'), b = document.getElementById('edOut'), l = document.getElementById('edLen');
  if(a) a.textContent = ed.inT == null ? '—' : fmt(ed.inT);
  if(b) b.textContent = ed.outT == null ? '—' : fmt(ed.outT);
  if(l) l.textContent = (ed.inT != null && ed.outT != null && ed.outT > ed.inT) ? 'Duración del corte ' + fmt(ed.outT - ed.inT) : 'Marca el inicio y el final del corte';
}
function edPreview(){
  if(!ed.el || ed.inT == null || ed.outT == null || ed.outT <= ed.inT){ toast('Marca antes el inicio y el final.', true); return; }
  ed.el.currentTime = ed.inT;
  ed.stopAt = ed.outT;
  ed.el.play();
}

// Extrae el trozo marcado y lo guarda como corte.
async function edSave(){
  if(ed.busy) return;
  if(!ed.el || ed.inT == null || ed.outT == null || ed.outT <= ed.inT + 0.1){ toast('Marca antes el inicio y el final.', true); return; }
  const name = (document.getElementById('edName').value || '').trim() || ('Corte ' + (cortes.length + 1));
  const inT = ed.inT, outT = ed.outT, len = outT - inT;
  const fileDur = isFinite(ed.el.duration) ? ed.el.duration : 1e9;
  ed.busy = true;
  const ctx = getCtx();
  let buf = null;

  // Archivos cortos: se decodifican enteros y el corte es inmediato.
  if(fileDur <= 240 && ed.file.size <= 40*1024*1024){
    edProgress(0.05, 'Recortando...');
    try{
      const whole = await ctx.decodeAudioData(await ed.file.arrayBuffer());
      buf = sliceBuffer(whole, inT, outT);
    }catch(e){ buf = null; }
  }

  // Grabaciones largas: se reproduce el tramo y se captura (tarda lo que dura el corte).
  if(!buf){
    try{
      if(!ed.src){
        ed.src = ctx.createMediaElementSource(ed.el);
        ed.dest = ctx.createMediaStreamDestination();
        ed.src.connect(ctx.destination);
        ed.src.connect(ed.dest);
      }
      ed.stopAt = null;
      ed.el.pause();
      ed.el.currentTime = inT;
      await new Promise(r => { if(!ed.el.seeking) r(); else ed.el.addEventListener('seeked', r, {once:true}); });
      const rec = newRecorder(ed.dest.stream);
      const chunks = [];
      rec.ondataavailable = e => { if(e.data && e.data.size > 0) chunks.push(e.data); };
      await ed.el.play();
      rec.start();
      const c0 = ed.el.currentTime;
      await new Promise(res => {
        ed.watch = setInterval(() => {
          const t = ed.el.currentTime;
          edProgress((t - inT) / len, 'Guardando el corte... (se oye mientras se guarda)');
          if(t >= outT || ed.el.ended){ clearInterval(ed.watch); res(); }
        }, 30);
      });
      const done = new Promise(r => { rec.onstop = r; });
      rec.stop();
      ed.el.pause();
      await done;
      const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
      const got = await ctx.decodeAudioData(await blob.arrayBuffer());
      const lead = Math.max(0, inT - c0);
      buf = sliceBuffer(got, lead, Math.min(got.duration, lead + len));
    }catch(e){
      ed.busy = false; edProgress(0, '');
      toast('No se ha podido guardar el corte en este navegador.', true);
      return;
    }
  }

  const mono = await toMono(buf, 44100);
  const item = {id:'c' + Date.now(), kind:'corte', name, blob:audioBufferToWav(mono), dur:mono.duration, created:Date.now()};
  const ok = await dbPut(item);
  cortes.push(item);
  corteBuffers[item.id] = mono;
  ed.busy = false;
  ed.inT = null; ed.outT = null;
  edProgress(0, '');
  toast(ok ? '✂ Corte «' + name + '» guardado.' : '✂ Corte guardado solo hasta que cierres la página.', !ok);
  renderCortesList();
  edMarks();
  const n = document.getElementById('edName'); if(n) n.value = '';
}
function edProgress(frac, txt){
  const p = document.getElementById('edProg'), t = document.getElementById('edProgTxt');
  if(p) p.style.width = Math.max(0, Math.min(1, frac))*100 + '%';
  if(t) t.textContent = txt || '';
}

let listenSrc = null;
async function listenCorte(id){

let delArmed = null;

function cortesListHTML(){

// ================= ENTRADA DEL PERIODISTA =================
let ent = {sint:true, rec:null, stream:null, chunks:[], voice:null, preview:null, previewUrl:null, recording:false, t0:0, tick:null};

function entStopAll(){
  if(ent.recording){ try{ ent.rec.stop(); }catch(e){} }
  if(ent.stream){ ent.stream.getTracks().forEach(t => t.stop()); ent.stream = null; }
  if(ent.tick){ clearInterval(ent.tick); ent.tick = null; }
  ent.recording = false;
}
async function entRecord(){
  if(ent.recording){ ent.rec.stop(); return; }
  getCtx();
  try{ ent.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('No se ha podido acceder al micrófono.', true); return; }
  ent.chunks = [];
  ent.rec = newRecorder(ent.stream);
  ent.rec.ondataavailable = e => { if(e.data && e.data.size > 0) ent.chunks.push(e.data); };
  ent.rec.onstop = async () => {
    ent.recording = false;
    if(ent.tick){ clearInterval(ent.tick); ent.tick = null; }
    if(ent.stream){ ent.stream.getTracks().forEach(t => t.stop()); ent.stream = null; }
    try{
      const blob = new Blob(ent.chunks, {type: ent.rec.mimeType || 'audio/webm'});
      ent.voice = await getCtx().decodeAudioData(await blob.arrayBuffer());
      await entBuild();
    }catch(e){ toast('No se ha podido procesar la grabación.', true); render(); }
  };
  ent.rec.start();
  ent.recording = true; ent.t0 = performance.now();
  render();
  ent.tick = setInterval(() => { const x = document.getElementById('entClock'); if(x) x.textContent = fmtShort((performance.now() - ent.t0)/1000); }, 250);
}
async function entUpload(input){
  const f = input.files && input.files[0];
  if(!f) return;
  try{
    ent.voice = await getCtx().decodeAudioData(await f.arrayBuffer());
    await entBuild();
  }catch(e){ toast('Ese archivo de audio no se puede leer. Prueba con MP3, M4A o WAV.', true); }
}
async function entBuild(){
  if(!ent.voice) return;
  ent.preview = await mixEntrada(ent.voice, ent.sint);
  if(ent.previewUrl) URL.revokeObjectURL(ent.previewUrl);
  ent.previewUrl = URL.createObjectURL(audioBufferToWav(ent.preview));
  render();
}
async function entUse(){
  if(!ent.preview) return;
  const mono = await toMono(ent.preview, 44100);
  const item = {id:'__entrada', kind:'entrada', blob:audioBufferToWav(mono), created:Date.now()};
  const ok = await dbPut(item);
  entradaCustom = item;
  introBuffer = null;
  toast(ok ? '🎙 Nueva entrada guardada en este dispositivo.' : '🎙 Entrada activa hasta que cierres la página.', !ok);
  ent.voice = null; ent.preview = null;
  render();
}
async function entReset(){
  await dbDel('__entrada');
  entradaCustom = null;
  introBuffer = null;
  toast('Vuelve a sonar la entrada original.');
  render();
}
async function entPlayCurrent(){
  try{ const b = await buildIntroBuffer(); const ctx = getCtx(); const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(); }
  catch(e){ toast('No se puede reproducir la entrada.', true); }
}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
// Genera una copia de la página con la entrada actual como entrada fija para todos.
async function entExport(){
  if(!entradaCustom){ toast('Primero guarda una entrada nueva.', true); return; }
  setStatus('PREPARANDO LA PÁGINA...', 'playing');
  try{
    let src = null;
    try{ const r = await fetch(location.href, {cache:'no-store'}); if(r.ok) src = await r.text(); }catch(e){}
    if(!src || src.indexOf('const INTRO_AUDIO_B64') < 0){
      src = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      src = src.replace(/<div class="stage" id="stage">[\s\S]*?<div id="toastWrap">/, '<div class="stage" id="stage"></div>\n<div id="toastWrap">');
    }
    const buf = await getCtx().decodeAudioData(await entradaCustom.blob.arrayBuffer());
    const small = await toMono(buf, 22050);
    const b64 = await blobToBase64(audioBufferToWav(small));
    const out = src.replace(/const INTRO_AUDIO_B64 = "[^"]*";/, 'const INTRO_AUDIO_B64 = "' + b64 + '";');
    const name = (location.pathname.split('/').pop() || 'conexionpolitica.html').replace(/\.html?$/i, '') + '-entrada-nueva.html';
    guardarArchivo(new Blob([out], {type:'text/html'}), name);
    setStatus('ENTRADA DEL PERIODISTA', 'idle');
  }catch(e){
    setStatus('ENTRADA DEL PERIODISTA', 'idle');
    toast('No se ha podido generar la página.', true);
  }
}

// ================= RENDER =================
function render(){
  updateNav();
  const el = document.getElementById('stage');
  if(view === 'cortes'){ renderCortesView(el); return; }
  if(view === 'entrada'){ renderEntradaView(el); return; }

  if(phase === 'config'){
    el.innerHTML = `
      <div class="panel">
        <div class="panel-head">CONFIGURAR LA CONEXIÓN</div>
        <div class="panel-body">
          <div class="field">
            <label>Reportero o equipo</label>
            <input type="text" id="labelInput" placeholder="Ej: Marta Ruiz · Equipo 3" value="${escapeAttr(reporteroLabel)}" oninput="updateLabel(this.value)">
          </div>
          <div class="field">
            <label>Tiempo de antena (segundos)</label>
            <input type="number" id="durInput" min="15" max="600" value="${durationSec}" oninput="updateDuration(this.value)">
            <div class="hint" id="durHint">${descripcionDuracion(durationSec)}</div>
          </div>
          <div class="btn-row" style="margin-bottom:16px">
            <button class="btn btn-outline" onclick="setPreset(30)">30 s</button>
            <button class="btn btn-outline" onclick="setPreset(60)">1 min</button>
            <button class="btn btn-outline" onclick="setPreset(90)">1:30</button>
            <button class="btn btn-outline" onclick="setPreset(120)">2 min</button>
          </div>
          <div class="field">
            <label>Cortes preparados (${cortes.length})</label>
            ${cortes.length ? '<div class="hint">Durante la conexión aparecerán como botones para lanzarlos cuando toque.</div>' + cortesListHTML() : '<div class="hint">No hay cortes. Podéis prepararlos en la pestaña «✂ Cortes» a partir de vuestras grabaciones.</div>'}
          </div>
          <div class="hint" style="margin-bottom:14px">Al pulsar «Preparar conexión» el navegador pedirá el micrófono, acéptalo antes de empezar.</div>
          <div style="text-align:center">
            <button class="big-btn dark" onclick="goReady()">Preparar conexión</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if(phase === 'ready'){
    el.innerHTML = `
      <div class="panel">
        <div class="panel-body stage-center">
          <div class="icon">📡</div>
          <h2>${reporteroLabel ? escapeHtml(reporteroLabel) : 'Conexión lista'}</h2>
          <p>Al pulsar EMITIR suena la sintonía y, a continuación, el paso desde estudio,
             con la presentación y la pregunta que os lanzan en directo.
             En cuanto termine, el micrófono se abre solo y arranca la cuenta atrás de ${durationSec} segundos.
             No hay margen, se empieza a hablar en ese mismo instante.
             ${cortes.length ? 'Tenéis ' + cortes.length + (cortes.length === 1 ? ' corte preparado' : ' cortes preparados') + ' para lanzar durante la crónica.' : ''}</p>
          <div style="margin-top:22px">
            <button class="big-btn" onclick="startEmission()">🔴 EMITIR</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-outline" onclick="phase='config'; render(); setStatus('LISTO PARA CONFIGURAR','idle')">← Cambiar configuración</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if(phase === 'intro'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body stage-center">
        <div class="icon">🎵</div>
        <h2>Sintonía y paso desde estudio...</h2>
        <p>El micrófono se abre en cuanto acabe la pregunta. Preparado.</p>
      </div></div>`;
    return;
  }

  if(phase === 'recording'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body">
        <div class="timer-wrap" id="timerWrap"></div>
        <div class="warn-banner ${showWarn ? 'show':''}" id="warnBanner">⏳ ¡QUEDAN ${warnAt} SEGUNDOS!</div>
        <div id="liveCortes"></div>
        <div class="btn-row">
          <button class="big-btn dark" onclick="stopRecording()">⏹ Cerrar conexión</button>
        </div>
      </div></div>`;
    renderTimerOnly();
    renderLiveCortes();
    return;
  }

  if(phase === 'outro'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body stage-center">
        <div class="icon">👋</div>
        <h2>Vuelta a estudio...</h2>
        <p>La conexión se está cerrando.</p>
      </div></div>`;
    return;
  }

  if(phase === 'mixing'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body stage-center">
        <div class="icon">🎛️</div>
        <h2>Montando la crónica...</h2>
        <p>Uniendo la sintonía, el paso desde estudio, vuestra crónica con sus cortes y la vuelta a estudio.</p>
      </div></div>`;
    return;
  }

  if(phase === 'done'){
    el.innerHTML = `
      <div class="panel">
        <div class="panel-head">CRÓNICA MONTADA ${reporteroLabel ? '· ' + escapeHtml(reporteroLabel) : ''}</div>
        <div class="panel-body stage-center">
          <div class="icon">✅</div>
          <h2>Sintonía, paso desde estudio, crónica y vuelta, en un solo archivo</h2>
          <audio controls src="${finalBlobUrl}"></audio>
          <div class="btn-row">
            <button class="btn btn-dark" onclick="guardarArchivo(finalBlob,'cronica_${slug(reporteroLabel)||'directo'}.wav')">⬇ Descargar crónica (.wav)</button>
            <button class="btn btn-outline" onclick="resetAll()">↺ Otra conexión</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if(phase === 'error'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body stage-center">
        <div class="icon">🎙️🚫</div>
        <h2>No se ha podido acceder al micrófono</h2>
        <p>Revisa que el navegador tenga permiso para usar el micrófono en esta página y vuelve a intentarlo.</p>
        <div class="btn-row">
          <button class="btn btn-dark" onclick="phase='ready'; render(); setStatus('LISTO PARA EMITIR','idle')">Reintentar</button>
        </div>
      </div></div>`;
    return;
  }
}

function renderLiveCortes(){
  const w = document.getElementById('liveCortes');
  if(!w) return;
  if(!cortes.length){ w.innerHTML = ''; return; }
  w.innerHTML = `<div class="live-cortes"><h3>CORTES · PULSA PARA LANZARLO</h3>` +
    cortes.map(c => {
      const on = playingCorte && playingCorte.id === c.id;
      const dis = (playingCorte && !on) || !corteBuffers[c.id];
      return `<button class="corte-btn ${on ? 'playing' : ''}" ${dis ? 'disabled' : ''} onclick="fireCorte('${c.id}')">${on ? '⏹ ' : '▶ '}${escapeHtml(c.name)}<small>${on ? 'sonando · pulsa para cortarlo' : fmtShort(c.dur)}</small></button>`;
    }).join('') + `</div>`;
}

function renderCortesView(el){
  const has = !!ed.url;
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">PREPARAR CORTES</div>
      <div class="panel-body">
        <div class="note">Subid la grabación (entrevista, rueda de prensa, declaraciones), buscad el trozo que queréis, marcad dónde empieza y dónde acaba y guardadlo como corte. Los cortes quedan guardados en este dispositivo y aparecen como botones durante la conexión para lanzarlos en el momento justo.</div>
        <div class="field">
          <label>Grabación</label>
          <input type="file" accept="audio/*,video/*" onchange="edLoadFile(this)">
          <div class="hint">Sirven archivos largos, de hasta un par de horas. En MP3, M4A o WAV funciona en todos los navegadores.</div>
        </div>
        ${has ? `
        <div class="hint" id="edInfo">${escapeHtml(ed.file.name)}</div>
        <div id="edPlayer"></div>
        <div style="text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums" id="edNow">0:00.0</div>
        <div class="ed-grid">
          <button class="mini" onclick="edSkip(-10)">⏪ 10 s</button>
          <button class="mini" onclick="edSkip(-2)">⏪ 2 s</button>
          <button class="mini" onclick="edToggle()">▶ / ⏸</button>
          <button class="mini" onclick="edSkip(2)">2 s ⏩</button>
          <button class="mini" onclick="edSkip(10)">10 s ⏩</button>
        </div>
        <div class="btn-row" style="margin-top:0">
          <input id="edGo" placeholder="Ir a (ej. 1:05:30)" style="border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;width:170px;font-family:inherit">
          <button class="mini" onclick="edGoto()">Ir</button>
        </div>
        <div class="marks">
          <div class="mark">
            <div class="lbl">INICIO DEL CORTE</div>
            <b id="edIn">—</b>
            <div class="nudge">
              <button class="mini" onclick="edNudge('in',-0.2)">−0,2</button>
              <button class="mini" onclick="edMark('in')">Marcar aquí</button>
              <button class="mini" onclick="edNudge('in',0.2)">+0,2</button>

          </div>
          <div class="mark">
            <div class="lbl">FINAL DEL CORTE</div>
            <b id="edOut">—</b>
            <div class="nudge">
              <button class="mini" onclick="edNudge('out',-0.2)">−0,2</button>
              <button class="mini" onclick="edMark('out')">Marcar aquí</button>
              <button class="mini" onclick="edNudge('out',0.2)">+0,2</button>

          </div>

        <div class="hint" id="edLen" style="text-align:center"></div>
        <div class="field" style="margin-top:12px">
          <label>Nombre del corte</label>
          <input type="text" id="edName" placeholder="Ej: Declaración del ministro">
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="edPreview()">▶ Escuchar el corte</button>
          <button class="btn btn-dark" onclick="edSave()">✂ Guardar corte</button>
        </div>
        <div class="progress"><div id="edProg"></div></div>
        <div class="hint" id="edProgTxt" style="text-align:center"></div>
        ` : ''}
        <div class="sep"></div>
        <div class="field" style="margin-bottom:0">
          <label>Cortes guardados</label>
          <div id="cortesList">${cortesListHTML()}</div>

function renderEntradaView(el){
  const fecha = entradaCustom ? new Date(entradaCustom.created).toLocaleString('es-ES', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
  el.innerHTML = `
    <div class="panel">
      <div class="panel-head">ENTRADA DEL PERIODISTA (PROFESORA)</div>
      <div class="panel-body">
        <div class="field">
          <label>Entrada que suena ahora</label>
          <div class="hint">${entradaCustom ? 'Entrada nueva, grabada el ' + fecha : 'Entrada original de la página'}</div>
          <div class="btn-row" style="justify-content:flex-start">
            <button class="mini" onclick="entPlayCurrent()">▶ Escuchar</button>
            ${entradaCustom ? '<button class="mini" onclick="entReset()">↺ Volver a la original</button>' : ''}
          </div>
        </div>
        <div class="sep"></div>
        <div class="field">
          <label>Grabar una entrada nueva</label>
          <div class="hint">Graba la presentación y la pregunta que el estudio lanza al reportero.</div>
          <div class="btn-row" style="justify-content:flex-start">
            <button class="btn ${ent.recording ? 'btn-dark' : 'btn-outline'}" onclick="entRecord()">${ent.recording ? '⏹ Parar grabación' : '🎙 Grabar'}</button>
          </div>
          ${ent.recording ? '<div class="rec-live"><span class="rec-pulse"></span>GRABANDO <span id="entClock">0:00</span></div>' : ''}
        </div>
        <div class="field">
          <label>O subir un audio ya grabado</label>
          <input type="file" accept="audio/*,video/*" onchange="entUpload(this)">
        </div>
        <label class="chk"><input type="checkbox" id="entSint" ${ent.sint ? 'checked' : ''} onchange="ent.sint=this.checked; entBuild()"> Poner la sintonía delante de la voz</label>
        ${ent.previewUrl && ent.preview ? `
          <div class="field">
            <label>Así sonará</label>
            <audio controls src="${ent.previewUrl}"></audio>
            <div class="btn-row"><button class="btn btn-dark" onclick="entUse()">✔ Usar esta entrada</button></div>
          </div>` : ''}
        <div class="sep"></div>
        <div class="note">La entrada nueva se guarda en este dispositivo. Para que suene en los ordenadores y móviles de los alumnos, descarga la página con la entrada incluida y súbela a GitHub en lugar de la actual.</div>
        <div class="btn-row">
          <button class="btn btn-outline" ${entradaCustom ? '' : 'disabled'} onclick="entExport()">⬇ Descargar página con esta entrada</button>

}

function renderTimerOnly(){
  const wrap = document.getElementById('timerWrap');
  if(!wrap) return;
  const frac = durationSec > 0 ? timeLeft / durationSec : 0;
  const offset = TOTAL_CIRC * (1 - frac);
  const mm = Math.floor(timeLeft/60).toString().padStart(2,'0');
  const ss = (timeLeft%60).toString().padStart(2,'0');
  wrap.innerHTML = `
    <div class="timer-circle">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
        <circle class="timer-ring ${timeLeft<=warnAt?'warn':''}" cx="110" cy="110" r="100"
          stroke-dasharray="${TOTAL_CIRC}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="timer-num">${mm}:${ss}</div>
    </div>
    <div style="text-align:center;font-weight:700;color:var(--red)"><span class="rec-pulse"></span>EN ANTENA</div>`;
  const banner = document.getElementById('warnBanner');
  if(banner) banner.className = 'warn-banner' + (showWarn ? ' show' : '');
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function slug(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }

render();
loadStore();
</script>

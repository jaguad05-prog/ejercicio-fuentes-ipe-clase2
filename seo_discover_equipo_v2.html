<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SEO y Discover · Equipo</title>
<style>
:root{--red:#C8102E;--ink:#1B1B1F;--paper:#fff;--bg:#F3F1EC;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--gold:#E8B54A;--team:#C8102E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
.top{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.t1{font-size:14px;font-weight:800;letter-spacing:.04em}
.t2{font-size:11px;color:var(--gold);letter-spacing:.06em}
.chip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;text-align:right}
.dot{width:16px;height:16px;border-radius:50%;background:var(--team);border:2px solid #fff;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:23px;line-height:1.2;margin-bottom:8px}
h2{font-size:18px;line-height:1.3;margin-bottom:10px}
p{line-height:1.45}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:13px;font-size:17px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--team)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:800;font-family:inherit;color:#fff;background:var(--red);cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45}
.btn.team{background:var(--team)}
.btn.out{background:#fff;color:var(--ink);border:2px solid var(--border);font-size:15px;padding:12px}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:20px;background:var(--ink);color:#fff;margin-bottom:10px}
.story{border-left:5px solid var(--red);padding-left:14px}
.story .ti{font-size:18px;font-weight:800;margin-bottom:6px}
.story .tx{font-size:16px;line-height:1.5}
.mine{background:#fff;border:2px solid var(--team);border-radius:12px;padding:14px;font-size:19px;font-weight:800;line-height:1.3}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--border);border-radius:12px;padding:14px;background:#fff;font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:10px;line-height:1.3}
.opt .L{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.opt.sel{border-color:var(--green);background:#eef7f1}
.opt.sel .L{background:var(--green);color:#fff}
.opt.own{opacity:.55;cursor:not-allowed;background:#f0eee9}
.opt.own .L{background:var(--team);color:#fff}
.res{border:2px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;background:#fff}
.res.me{border-color:var(--team);box-shadow:0 0 0 2px var(--team)}
.res .who{font-size:12px;font-weight:800;letter-spacing:.04em}
.res .h{font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.res .p{margin-left:auto;font-size:24px;font-weight:900;color:var(--red);flex:none}
.res.disq .h{text-decoration:line-through;color:var(--red)}
.st{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-weight:700}
.st:last-child{border-bottom:none}
.st b{margin-left:auto;color:var(--red);font-size:18px}
.st.me{color:var(--team)}
.big{font-size:44px;text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}
.small a{color:var(--muted)}
.pl{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:14px;line-height:1.35}
.pl .L{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.hq{border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.hq.done{border-color:var(--team)}
.hq .q{font-size:16px;font-weight:700;line-height:1.35;margin-bottom:10px}
.hq .q b{color:var(--red)}
.ls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ls button{border:2px solid var(--border);background:#fff;border-radius:9px;padding:10px 0;font-size:17px;font-weight:900;font-family:inherit;color:var(--ink);cursor:pointer}
.ls button.on{background:var(--team);border-color:var(--team);color:#fff}
.res2{font-size:14px;margin-top:8px;font-weight:700}
.res2.ok{color:var(--green)}.res2.ko{color:var(--red)}
.srch{display:flex;gap:8px}
.srch input{flex:1}
.srch button{border:none;border-radius:10px;background:var(--team);color:#fff;font-weight:900;font-size:22px;width:56px;cursor:pointer}
.bq{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:16px}
.bq button{border:none;background:none;font-size:16px;color:var(--muted);cursor:pointer}
.bq.hit{background:#eef7f1;color:var(--green);font-weight:800}
.sl{display:flex;gap:10px;align-items:center;border:2px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sl .t{flex:1;font-weight:800;font-size:15px}
.sl .p{font-weight:900;color:var(--red)}
.sl.mine{border-color:var(--green);background:#eef7f1}
</style>
</head>
<body>
<div class="top">
  <div><div class="t1">SEO Y DISCOVER</div><div class="t2">CLASE 9 · DISCOVER Y GOOGLE</div></div>
  <div class="chip" id="chip"></div>
</div>
<div class="wrap" id="app"></div>

<script>
// Pinta un material de la Parte 3 (lo usan la pantalla y los móviles)
function pintaMaterial(m, esc){
  if (m.kind === "ig") return `<div class="igwrap"><div class="ig">
      <div class="igtop"><span class="igav">${esc(m.handle.slice(0,2).toUpperCase())}</span><b>${esc(m.handle)}</b><span class="igm">${esc(m.meta.split(" · ")[0])}</span></div>
      <div class="igtxt">${m.body.map(l => esc(l)).join("<br>")}</div>
      <div class="igstats">${esc(m.meta.split(" · ").slice(1).join(" · "))}</div></div>
      <p class="igcap">${esc(m.caption)}</p></div>`;
  if (m.kind === "entrevista") return `<div class="paper"><div class="ptag">${esc(m.label.replace(/^MATERIAL \d · /,""))}</div><h3>${esc(m.title)}</h3><p class="plead">${esc(m.lead)}</p>
      ${m.body.map(x => { const [q, a] = x.split("|"); return `<p class="pq">${esc(q)}</p><p>${esc(a)}</p>`; }).join("")}</div>`;
  return `<div class="paper teletipo"><div class="ptag">EFE · DEPORTES · PREVIA</div><h3>${esc(m.title)}</h3>${m.body.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
}
const CSS_MATERIAL = `
.paper{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;line-height:1.55}
.paper h3{font-family:Georgia,serif;font-size:21px;line-height:1.25;margin:4px 0 10px}
.paper p{margin:0 0 9px;font-size:15px}
.paper .ptag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--red)}
.paper .plead{font-style:italic;color:var(--muted)}
.paper .pq{font-weight:800;margin-top:12px}
.teletipo{font-family:"Courier New",monospace}
.teletipo h3{font-family:"Courier New",monospace;font-weight:900}
.igwrap{display:flex;flex-direction:column;align-items:center}
.ig{width:300px;max-width:100%;aspect-ratio:9/16;border-radius:16px;background:linear-gradient(180deg,#0d0d12 0%,#1a0f14 60%,#5b0f18 100%);color:#fff;padding:14px;display:flex;flex-direction:column}
.igtop{display:flex;align-items:center;gap:8px;font-size:13px}
.igav{width:28px;height:28px;border-radius:50%;background:#C8102E;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.igm{color:#bbb;font-size:12px}
.igtxt{margin:auto 0;text-align:center;font-weight:800;font-size:17px;line-height:1.45}
.igstats{text-align:center;font-size:11px;color:#ccc;margin-bottom:6px}
.igcap{font-style:italic;color:var(--muted);font-size:13px;margin-top:8px}
`;

document.head.insertAdjacentHTML('beforeend','<style>'+CSS_MATERIAL+'</style>');
</script>
<script>
// ===== CONFIGURACIÓN =====
const API_URL = "https://script.google.com/macros/s/AKfycbyJkXj7CoPtNXyQLsAypxUVWB4i4bdDtg_D583p-t_3R4xW_u0_xqO_zunqAmtYm4G1/exec";
// =========================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const qs = new URLSearchParams(location.search);

let API = qs.get("api") || (API_URL.startsWith("http") ? API_URL : "") || lsGet("seod_api", "");
let CODE = (qs.get("c") || lsGet("seod_eq_code", "")).toUpperCase();
let DEV = lsGet("seod_dev", "");
if (!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("seod_dev", DEV); }
let unido = lsGet("seod_eq_joined", "") === CODE && !!CODE;
let S = null, vista = "", ocupado = false, borrador = "";
// Cambios que el móvil acaba de hacer y que aún no ha confirmado el servidor
let pendientes = {};

// Orden de las peticiones: una respuesta antigua nunca pisa una más nueva.
// Si el servidor devuelve la partida junto con la acción, se usa sin pedirla otra vez.
let SEQ = 0, APLICADO = 0, FRESCO = 0;
function usarFresco(){ if (FRESCO && Date.now() - FRESCO < 3000){ FRESCO = 0; return true; } return false; }
async function api(params){
  const seq = ++SEQ;
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, dev: DEV }, params)) });
  const j = await r.json(); if (j.error) throw new Error(j.error);
  if (params.a === "state"){ if (seq < APLICADO) throw new Error("viejo"); APLICADO = seq; }
  else if (j.state && j.state.me && seq > APLICADO){ APLICADO = seq; S = j.state; FRESCO = Date.now(); }
  return j;
}
function pintarEntrada(msg){
  $("chip").innerHTML = "";
  $("app").innerHTML = `<div class="card"><h1>Entra con tu equipo</h1>
    <p class="muted">Escribe el nombre de tu equipo exactamente igual que tus compañeros.</p>
    ${API ? "" : `<label>Dirección del servidor</label><input id="inApi">`}
    <label>Código de la partida</label><input id="inCode" value="${esc(CODE)}" maxlength="6" autocapitalize="characters" placeholder="Lo ves en la pantalla">
    <label>Nombre de tu equipo</label><input id="inTeam" value="${esc(lsGet("seod_eq_name", ""))}" maxlength="30" placeholder="Ej: Los Plumillas">
    <button class="btn" id="btnJoin">Entrar</button><div class="err" id="err">${esc(msg || "")}</div></div>`;
  $("btnJoin").onclick = entrar;
}
async function entrar(){
  if (!API) API = ($("inApi").value || "").trim();
  CODE = $("inCode").value.trim().toUpperCase();
  const name = $("inTeam").value.trim();
  if (!API || !CODE || !name) return $("err").textContent = "Rellena el código y el nombre del equipo";
  $("btnJoin").disabled = true; $("btnJoin").textContent = "Entrando…";
  try { await api({ a:"join", name }); lsSet("seod_api", API); lsSet("seod_eq_code", CODE); lsSet("seod_eq_name", name); lsSet("seod_eq_joined", CODE); unido = true; vista = ""; await refrescar(true); }
  catch(e){ $("err").textContent = e.message; $("btnJoin").disabled = false; $("btnJoin").textContent = "Entrar"; }
}
function cambiarEquipo(){ unido = false; lsSet("seod_eq_joined", ""); S = null; pintarEntrada(); }

let pidiendo = false;
async function refrescar(forzar){
  if (!unido || (pidiendo && !forzar)) return;
  pidiendo = true;
  try {
    if (!(forzar && usarFresco())) S = await api({ a:"state" });
    if (!S.me){ unido = false; return pintarEntrada("Vuelve a entrar con el nombre de tu equipo"); }
    pintar();
  } catch(e){ if (/No existe/.test(e.message)){ unido = false; pintarEntrada(e.message); } }
  finally { pidiendo = false; }
}
// Cada móvil pregunta cada 6,5-8 segundos y deja de preguntar con la pantalla bloqueada o en otra app
setInterval(() => { if (!document.hidden) refrescar(); }, 6500 + Math.floor(Math.random() * 1500));
document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(true); });

async function hacer(params, err){
  try { await api(params); } catch(e){ const el = $("err"); if (el) el.textContent = e.message; }
}

// Une el patrón: se marca al momento en el móvil y se envía
async function elegir(i, L){
  const actual = pendientes[i] !== undefined ? pendientes[i] : (S.me.answers[i] || "");
  const nuevo = actual === L ? "" : L;
  pendientes[i] = nuevo; vista = ""; pintar();
  try { await api({ a:"match", i, L: nuevo }); } catch(e){ delete pendientes[i]; }
  setTimeout(() => { delete pendientes[i]; }, 6000);
}
async function anadir(){
  const inp = $("q"); const txt = inp.value.trim(); if (!txt) return;
  inp.disabled = true; $("err").textContent = "";
  try { await api({ a:"add", text: txt }); borrador = ""; vista = ""; await refrescar(true); }
  catch(e){ borrador = txt; vista = ""; await refrescar(true); $("err").textContent = e.message; }
}
let borradorT = "", enviandoT = false;
async function enviarTitular(){
  const t = $("tt"); const txt = t.value.trim(); if (!txt) return $("err").textContent = "Escribe el titular";
  $("btnT").disabled = true; $("btnT").textContent = "Enviando…";
  try { await api({ a:"t_send", text: txt }); borradorT = ""; vista = ""; await refrescar(true); }
  catch(e){ borradorT = txt; vista = ""; await refrescar(true); $("err").textContent = e.message; }
}
async function quitar(i){ await hacer({ a:"remove", i }); vista = ""; await refrescar(true); }

function pintar(){
  const g = S.game, me = S.me;
  document.documentElement.style.setProperty("--team", me.color);
  $("chip").innerHTML = `<span>${esc(me.teamName)}</span><span class="dot"></span>`;
  const misPts = (S.teams.find(t => t.id === me.team) || {}).pts || 0;
  const clave = JSON.stringify([g, me, pendientes, misPts]);
  if (clave === vista) return;
  if (document.activeElement && document.activeElement.id === "tt" && g.status === "t_write") return;
  if (document.activeElement && document.activeElement.id === "q" && g.status === "search" && vista && JSON.parse(vista)[0].status === "search"){
    // si estás escribiendo una búsqueda, solo se actualiza la lista
    const l = $("lista"); if (l) l.innerHTML = listaBusquedas(me.searches, true);
    vista = clave; return;
  }
  vista = clave;
  const pie = `<div class="small">Equipo: ${esc(me.teamName)} · ${misPts} puntos · <a href="#" onclick="cambiarEquipo();return false">cambiar de equipo</a></div>`;
  let h = "";
  if (g.status === "lobby"){
    h = `<div class="card center"><div class="big">📰</div><h1>¡Dentro!</h1><p class="muted">Estáis en <b>${esc(me.teamName)}</b>. Esperad a que empiece el juego.</p></div>`;
  } else if (g.status === "match"){
    const resp = Object.assign({}, me.answers, pendientes);
    const hechas = g.p1.heads.filter((_, i) => resp[i+1]).length;
    h = `<div class="card"><span class="tag">PARTE 1 · UNE EL PATRÓN</span>
      <p class="muted" style="margin-bottom:12px">Une cada titular con su patrón. Hay 8 titulares y 6 patrones, así que dos se repiten. Lo que marquéis lo ven todos los móviles del equipo.</p>
      ${g.p1.pats.map(p => `<div class="pl"><span class="L">${p.L}</span><span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.desc)}</span></span></div>`).join("")}</div>
      ${g.p1.heads.map((t, i) => { const a = resp[i+1] || ""; return `<div class="hq ${a ? "done" : ""}"><div class="q"><b>${i+1}.</b> «${esc(t)}»</div>
        <div class="ls">${g.p1.pats.map(p => `<button class="${a === p.L ? "on" : ""}" onclick="elegir(${i+1},'${p.L}')">${p.L}</button>`).join("")}</div></div>`; }).join("")}
      <div class="card center"><b>${hechas} de ${g.p1.heads.length}</b> unidos</div>`;
  } else if (g.status === "match_reveal"){
    const nombre = L => (g.p1.pats.find(p => p.L === L) || {}).name || "";
    const sc = (g.p1score || {})[me.team] || 0;
    h = `<div class="card"><span class="tag">PARTE 1 · CORRECCIÓN</span><p class="muted">Mirad la pantalla. Aquí veis vuestras respuestas.</p></div>
      ${g.p1.heads.map((t, i) => { const a = me.answers[i+1] || "–", shown = i < g.revealed, ok = g.key && g.key[i+1];
        return `<div class="hq"><div class="q"><b>${i+1}.</b> «${esc(t)}»</div>
          <div>Vuestra respuesta: <b>${a}</b></div>
          ${shown ? `<div class="res2 ${a === ok ? "ok" : "ko"}">${a === ok ? "✓ Correcto" : "✕ Era la " + ok} · ${esc(nombre(ok))}</div>` : ""}</div>`; }).join("")}
      ${g.revealed >= g.p1.heads.length ? `<div class="card center"><h2>${sc} de ${g.p1.heads.length} correctas</h2><p class="muted">+${sc * 10} puntos para ${esc(me.teamName)}</p></div>` : ""}`;
  } else if (g.status === "search"){
    h = `<div class="card"><span class="tag">PARTE 2 · ${esc(g.sit.tag)}</span><div class="story"><div class="ti">${esc(g.sit.text)}</div></div></div>
      <div class="card"><h2>🔍 ¿Qué escribe la gente en Google?</h2>
        <p class="muted" style="margin-bottom:10px">Escribid las búsquedas tal cual las teclearía la gente. Hasta 6 por equipo, y cualquiera del equipo puede añadir o borrar.</p>
        <div class="srch"><input id="q" maxlength="90" placeholder="Ej: a qué hora es la final" value="${esc(borrador)}" onkeydown="if(event.key==='Enter')anadir()" oninput="borrador=this.value"><button onclick="anadir()">+</button></div>
        <div class="err" id="err"></div>
        <div id="lista">${listaBusquedas(me.searches, true)}</div></div>`;
  } else if (g.status === "reveal"){
    const panel = g.panel || [];
    h = `<div class="card"><span class="tag">PARTE 2 · ${esc(g.sit.tag)}</span><div class="story"><div class="ti">${esc(g.sit.text)}</div></div></div>
      <div class="card"><h2>El panel real</h2>
        ${panel.length ? panel.map((p, i) => { const mio = (g.awards[i] || []).includes(me.team);
          return `<div class="sl ${mio ? "mine" : ""}"><span class="t">${esc(p.text)}</span>${p.pts ? `<span class="p">${mio ? "✓ +" : ""}${p.pts}</span>` : ""}</div>`; }).join("") : `<p class="muted">Mirad la pantalla, se va destapando…</p>`}
        ${g.note ? `<p style="margin-top:10px;line-height:1.5">💡 ${esc(g.note)}</p>` : ""}</div>
      <div class="card"><h2>Lo que buscasteis</h2>${listaBusquedas(me.searches, false)}</div>`;
  } else if (g.status === "t_write"){
    const m = g.mat;
    h = `<div class="card"><span class="tag">PARTE 3 · ${esc(m.label)}</span><p style="margin-bottom:10px">${esc(g.suceso)}</p>${pintaMaterial(m, esc)}</div>
      <div class="card"><h2>${m.kind === "seo" ? "🔍 Titular SEO" : "📱 Titular Discover"}</h2><p class="muted" style="margin-bottom:10px">${esc(m.task)} Uno por equipo: si lo volvéis a enviar, se cambia.</p>
        ${me.title ? `<div class="mine" style="margin-bottom:10px">${esc(me.title)}</div>` : ""}
        <textarea id="tt" maxlength="200" placeholder="${me.title ? "Cambiar el titular…" : "Vuestro titular…"}" oninput="borradorT=this.value">${esc(borradorT)}</textarea>
        <button class="btn team" id="btnT" onclick="enviarTitular()">${me.title ? "Cambiar el titular" : "Enviar el titular"}</button><div class="err" id="err"></div></div>`;
  } else if (g.status === "t_review"){
    const nota = (g.tscore || {})[me.team] || 0;
    h = `<div class="card"><span class="tag">PARTE 3 · ${esc(g.mat.label)}</span><h2>Vuestro titular</h2><div class="mine">${me.title ? esc(me.title) : "<i>No enviasteis titular</i>"}</div>
        <h1 class="center" style="margin-top:14px">${nota} / 30</h1></div>
      <div class="card"><h2>Titular de referencia</h2><p style="font-weight:800">${esc(g.tref)}</p></div>
      <div class="card"><h2>Los de los demás equipos</h2>${S.teams.filter(t => t.id !== me.team).map(t => `<div class="res"><div><div class="who" style="color:${t.color}">${esc(t.name)}</div><div class="h">${esc((S.titles || {})[t.id] || "Sin titular")}</div></div><div class="p">${(g.tscore || {})[t.id] || 0}</div></div>`).join("")}</div>`;
  } else if (g.status === "over"){
    const ord = [...S.teams].sort((a, b) => b.pts - a.pts);
    h = `<div class="card center"><div class="big">🏆</div><h1>${esc(ord[0] ? ord[0].name : "")}</h1><p class="muted">gana con ${ord[0] ? ord[0].pts : 0} puntos</p></div>
      <div class="card"><h2>Clasificación</h2>${ord.map((t, i) => `<div class="st ${t.id === me.team ? "me" : ""}"><span>${i+1}.</span><span>${esc(t.name)}</span><b>${t.pts}</b></div>`).join("")}</div>`;
  }
  $("app").innerHTML = h + pie;
}
function listaBusquedas(lista, borrar){
  if (!lista.length) return `<p class="muted" style="margin-top:10px">Todavía no habéis escrito ninguna.</p>`;
  return lista.map((b, i) => `<div class="bq"><span>${esc(b)}</span>${borrar ? `<button onclick="quitar(${i})">✕</button>` : ""}</div>`).join("");
}

if (unido && API) refrescar(true); else pintarEntrada();
</script>

</html>

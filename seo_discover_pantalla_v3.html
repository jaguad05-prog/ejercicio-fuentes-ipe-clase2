<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO y Discover · Pantalla</title>
<style>
:root{--red:#C8102E;--dark:#1B1B1F;--ink:#2B2B30;--paper:#fff;--tint:#FBF1F2;--gold:#E8B54A;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--bg:#F5F5F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.topbar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;flex-wrap:wrap}
.tt{font-size:16px;font-weight:800;letter-spacing:.04em}
.ts{font-size:11px;color:var(--gold);letter-spacing:.06em}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:20px;letter-spacing:.03em}
.codebadge{background:#fff;color:var(--dark);font-weight:800;font-size:15px;padding:6px 12px;border-radius:8px;letter-spacing:.12em}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:700}
.tbtn:hover{background:rgba(255,255,255,.22)}
.layout{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:18px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden}
.ph{background:var(--dark);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px}
.ph span{color:var(--gold)}
.pb{padding:18px}
.btn{border:none;padding:13px 20px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.b-red{background:var(--red);color:#fff}.b-dark{background:var(--dark);color:#fff}.b-gold{background:var(--gold);color:var(--dark)}
.b-out{background:#fff;border:2px solid var(--border);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit}
.field textarea{min-height:110px}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:18px}
/* lobby */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media(max-width:700px){.lobby{grid-template-columns:1fr}}
.bigcode{font-size:64px;font-weight:900;letter-spacing:.14em;color:var(--dark)}
.link{font-size:14px;word-break:break-all;color:var(--muted);margin-top:6px}
#qr{background:#fff;padding:6px;border-radius:10px;border:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:7px;border:2px solid var(--border);border-radius:30px;padding:7px 13px;font-weight:800;font-size:14px;background:#fff}
.chip i{width:12px;height:12px;border-radius:50%;display:block}
.chip small{font-weight:600;color:var(--muted)}
.chip.ok{border-color:var(--green);background:#eef7f1}
.chip.wr{border-color:var(--gold);background:#fffaf0}
/* noticias */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.nc{border:2px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left;font-family:inherit}
.nc:hover{border-color:var(--red)}
.nc.used{opacity:.45}
.nc .tg{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--red)}
.nc .ti{font-size:15px;font-weight:800;margin:4px 0 6px;color:var(--ink)}
.nc .tx{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story{border-left:6px solid var(--red);background:var(--tint);border-radius:0 12px 12px 0;padding:18px 22px}
.story .tg{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--red)}
.story .ti{font-size:24px;font-weight:900;margin:4px 0 10px}
.story .tx{font-size:21px;line-height:1.5}
/* papeleta */
.ballot{display:flex;flex-direction:column;gap:12px}
.bal{display:flex;gap:14px;align-items:center;border:2px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff}
.bal .L{width:46px;height:46px;border-radius:50%;background:var(--dark);color:var(--gold);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.bal .h{flex:1;font-size:22px;font-weight:800;line-height:1.3}
.bal.disq{background:#fdeceb;border-color:var(--red)}
.bal.disq .h{text-decoration:line-through;color:var(--red)}
.bal.disq .L{background:var(--red);color:#fff}
.xbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer;font-family:inherit;font-size:12.5px;flex:none}
.xbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.counter{font-size:18px;font-weight:800}
.counter b{color:var(--red);font-size:26px}
/* resultados */
.res{display:flex;gap:14px;align-items:center;border:2px solid var(--border);border-radius:12px;padding:12px 16px;background:#fff}
.res.win{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:#fffaf0}
.res .who{font-size:13px;font-weight:800;letter-spacing:.04em}
.res .h{font-size:19px;font-weight:800;line-height:1.3;margin-top:3px}
.res .pts{margin-left:auto;text-align:right;flex:none}
.res .pts b{font-size:30px;color:var(--red);display:block;line-height:1}
.res .pts small{font-size:12px;color:var(--muted)}
.res.disq .h{text-decoration:line-through;color:var(--red)}
/* clasificación */
.st{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.st .rk{width:24px;height:24px;border-radius:50%;background:var(--dark);color:var(--gold);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.st.top .rk{background:var(--gold);color:var(--dark)}
.st .dt{width:12px;height:12px;border-radius:50%;flex:none}
.st .nm{flex:1;font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .pt{font-size:18px;font-weight:900;color:var(--red)}
.adj{border:1px solid var(--border);background:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-weight:800;font-size:13px;line-height:1;padding:0}
.notes{background:#fffaf0;border:2px dashed var(--gold);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55}
.notes b{color:var(--dark)}
.notes .mal{color:var(--red)}.notes .bien{color:var(--green)}
.champ{background:linear-gradient(135deg,var(--gold),#f3d38a);border-radius:16px;padding:30px;text-align:center}
.champ .tr{font-size:52px}
.champ h3{font-size:13px;letter-spacing:.1em;margin:6px 0}
.champ .nm{font-size:40px;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:20px;font-style:italic;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.warn{background:var(--red)}

/* parte 1 */
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pat{border:2px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.pat .L{width:34px;height:34px;border-radius:50%;background:var(--dark);color:var(--gold);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.pat b{display:block;font-size:15px}
.pat small{color:var(--muted);font-size:12.5px;line-height:1.35}
.heads{display:flex;flex-direction:column;gap:9px}
.hd{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--border);border-radius:12px;padding:11px 14px;background:#fff}
.hd .n{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.hd .t{font-size:17px;font-weight:700;line-height:1.35;flex:1}
.hd.hidden .t{color:var(--muted);font-style:italic;font-weight:400}
.hd .sol{margin-top:8px;font-size:14px;line-height:1.45}
.hd .sol .orig{display:block;color:var(--muted);font-style:italic;margin-top:3px}
.ticks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tk{font-size:12px;font-weight:800;padding:4px 9px;border-radius:14px;border:1.5px solid var(--border);background:#fff}
.tk.ok{background:#eef7f1;border-color:var(--green);color:var(--green)}
.tk.ko{background:#fdeceb;border-color:var(--red);color:var(--red)}
.dato{background:var(--dark);color:#fff;border-radius:14px;padding:20px 22px;font-size:19px;line-height:1.5}
.dato b{color:var(--gold)}
/* parte 2 */
.slot{border:2px solid var(--border);border-radius:12px;padding:12px 16px;background:#fff;margin-bottom:10px}
.slot.hid{background:var(--bg)}
.slot .top{display:flex;align-items:center;gap:12px}
.slot .pos{width:34px;height:34px;border-radius:50%;background:var(--dark);color:var(--gold);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.slot .txt{flex:1;font-size:20px;font-weight:800}
.slot.hid .txt{color:var(--muted);font-style:italic;font-weight:400;font-size:16px}
.slot .pp{background:var(--dark);color:var(--gold);border-radius:7px;padding:4px 10px;font-weight:800;font-size:14px;flex:none}
.awards{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.aw{border:2px solid var(--border);background:#fff;border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.aw i{width:10px;height:10px;border-radius:50%;display:block}
.aw.sug{border-color:var(--gold);background:#fffaf0}
.aw.on{background:var(--green);border-color:var(--green);color:#fff}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gc{border:2px solid var(--border);border-radius:12px;padding:12px;background:#fff}
.gc h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.gc h4 i{width:11px;height:11px;border-radius:50%;display:block}
.gi{background:var(--bg);border-radius:7px;padding:6px 10px;font-size:14px;margin-bottom:5px}
.gi.hit{background:#eef7f1;color:var(--green);font-weight:800}
.note{background:#fffaf0;border:2px dashed var(--gold);border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.5}
</style>
</head>

function toast(msg, warn){ const t = $("toast"); t.textContent = msg; t.className = warn ? "warn show" : "show"; clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 3800); }
// Orden de las peticiones: una respuesta antigua nunca pisa una más nueva.
// Si el servidor devuelve la partida junto con la acción, se usa sin pedirla otra vez.
let SEQ = 0, APLICADO = 0, FRESCO = 0;
function usarFresco(){ if (FRESCO && Date.now() - FRESCO < 3000){ FRESCO = 0; return true; } return false; }
async function api(params){
  const seq = ++SEQ;
  const r = await fetch(API, { method:"POST", body: JSON.stringify(params) });
  const j = await r.json(); if (j.error) throw new Error(j.error);
  if (params.a === "state"){ if (seq < APLICADO) throw new Error("viejo"); APLICADO = seq; }
  else if (j.state && seq > APLICADO){ APLICADO = seq; S = j.state; FRESCO = Date.now(); }
  return j;
}
let ocupado = false;
async function accion(params, okMsg){
  if (ocupado) return; ocupado = true;
  try { await api(Object.assign({ c: CODE, k: KEY }, params)); if (okMsg) toast(okMsg); ultimaVista = ""; await refrescar(true); }
  catch(e){ toast(e.message, true); }
  finally { ocupado = false; }
}
const armado = {};
function confirmar(k, msg){ if (armado[k]) { armado[k] = false; return true; } armado[k] = true; toast(msg, true); setTimeout(() => armado[k] = false, 4000); return false; }

let pidiendo = false;
async function refrescar(forzar){
  if (!CODE || (pidiendo && !forzar)) return;

  try { if (!(forzar && usarFresco())) S = await api({ a:"state", c: CODE, k: KEY }); pintar(); }

  finally { pidiendo = false; }
}

  "cuánto dura la prórroga en un mundial de fútbol": ["prorroga","dura","minutos","tiempo extra"],
  "ferran torres de dónde es": ["de donde","donde es","naci","origen","pueblo","natal","natural","biografia","que ciudad"],
  "cuándo llega la selección española a madrid": ["llega","aterriza","vuelve","regres","avion","aeropuerto"],
  "cuándo es la celebración de españa si gana el mundial": ["celebra","fiesta","festej","homenaje","recepcion","campeona"],
  "quién metió el gol del mundial de españa": ["=gol","goles","marc","meti","anot","goleador"],
  "en qué equipo juega ferran torres": ["equipo","club","juega"],
  "camiseta españa 2 estrellas": ["+estrella","=2","=dos","segunda"],
  "camiseta nueva de españa": ["nueva","nuevo","sale","lanza","presenta","como es"],
  "mundial 2030": ["mundial","2030"],
  "la foto de messi bañando a lamine yamal de bebé": ["foto","messi","lamine","yamal","bebe","banando","bano"]
};
const INTENC_N = {};
const norm = s => " " + String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
Object.keys(INTENC).forEach(k => INTENC_N[norm(k).trim()] = INTENC[k]);
function puntosIntencion(busq, casilla){
  const lista = INTENC_N[norm(casilla).trim()]; if (!lista) return null;
  const t = norm(busq), w = t.trim().split(" ");
  let p = 0;
  for (let k of lista){
    let peso = 1; if (k[0] === "~"){ peso = .5; k = k.slice(1); } else if (k[0] === "+"){ peso = 2; k = k.slice(1); }
    const hit = k.includes(" ") ? t.includes(" " + k + " ") : k[0] === "=" ? w.includes(k.slice(1)) : w.some(x => x.startsWith(k));
    if (hit) p += peso;
  }
  return p;
}
// La búsqueda se lleva la casilla cuya intención encaja mejor (si empatan, todas las empatadas).
function porIntencion(busq, casilla, panel){
  const textos = (panel || [casilla]).map(x => typeof x === "string" ? x : x.text);
  const pts = textos.map(x => puntosIntencion(busq, x));
  if (pts.some(p => p === null)) return null;
  const max = Math.max(...pts);
  return max >= 1 && puntosIntencion(busq, casilla) === max;
}

const STOP = new Set("a al la el los las de del en y o u que es son un una unos unas por con para se su sus lo le les mi tu hoy ya va este esta esto eso hay ha han fue cuanto cuanta cuantos cuantas tiene tienen tener sera estara fc cf".split(" "));
const SIN = [
  ["hora","horario","cuando","empieza","comienza","juega"],
  ["donde","ver","tv","television","canal","retransmision","emite","emision","directo","abierto","online","streaming","gratis"],
  ["precio","cuesta","cuestan","coste","costado","vale","valen","dinero","euros","millones","barato","caro","comprar","venta","vender"],
  ["entrada","entradas","ticket","tickets","abono"],
  ["alineacion","alineaciones","once","titulares","convocatoria","convocados"],
  ["baja","tiempo","dias","semanas","meses","recuperacion","recuperarse","recupera","volvera","plazo"],
  ["lesion","lesiones","lesionado","lesiona","parte","medico","diagnostico","rotura","esguince"],
  ["fichaje","fichado","ficha","firma","nuevo"],
  ["celebracion","celebra","fiesta","festejo"],
  ["rua","desfile","recorrido","autobus"],
  ["camiseta","equipacion","elastica"],

  ["llega","llegada","vuelve","aterriza"],
  ["estadisticas","datos","numeros","trayectoria","historial","carrera","anteriores","previas"]
];
const CANON = {}; SIN.forEach(g => g.forEach(w => CANON[w] = g[0]));
const raiz = w => CANON[w] || (w.length > 5 ? w.slice(0, 5) : w);
const palabras = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ ]+/g, " ").split(/\s+/).filter(w => w && !STOP.has(w)).map(raiz);
// Una búsqueda acierta una casilla si comparte al menos una palabra propia de esa casilla
// (que no se repite en las demás casillas del panel) y al menos dos palabras en total.
function parecido(busq, casilla, panel){
  const ia = porIntencion(busq, casilla, panel); if (ia !== null) return ia;
  const a = new Set(palabras(busq)), b = [...new Set(palabras(casilla))];
  if (!b.length || !a.size) return false;
  const otras = (panel || []).map(x => typeof x === "string" ? x : x.text).filter(x => x !== casilla).map(x => new Set(palabras(x)));
  // Palabras propias: las que menos se repiten en las demás casillas del panel
  const veces = w => otras.filter(o => o.has(w)).length;
  const minimo = Math.min(...b.map(veces));
  const propias = b.filter(w => veces(w) === minimo);
  const comunes = b.filter(w => a.has(w)).length;
  return propias.some(w => a.has(w)) && comunes >= Math.min(2, b.length);
}

    </div></div>
    <div class="panel"><div class="ph">LO QUE HA BUSCADO CADA EQUIPO <span>en verde, lo que se parece al panel</span></div><div class="pb"><div class="gg">${tarjetas}</div></div></div>
    <div class="row">${ultima ? `<button class="btn b-red" onclick="empezarMaterial(0)">▶ Pasar a la Parte 3 · Titula para SEO o Discover</button>` : `<button class="btn b-red" onclick="empezarRonda(${g.round+1})">▶ Siguiente: ${esc(RONDAS[g.round+1].tag)}</button>`}</div>`;
}
function destapar(n){
  const r = RONDAS[S.game.round];

    auto[i] = S.teams.filter(t => ((S.searches || {})[t.id] || []).some(b => parecido(b, r.panel[i].text, r.panel))).map(t => t.id);
  }
  accion({ a:"open", panel: r.panel.slice(0, n), auto, note: n >= r.panel.length && r.trap ? r.note : "" });
}

// ── PARTE 3 · TITULA PARA SEO O DISCOVER ──
const n3 = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ç/g, "c").replace(/\s+/g, " ").trim();
const soloLetras = s => n3(s).replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim();
// Lo que va entre comillas en el titular
function citas(t){
  const out = []; const re = /[«"“”'‘’]([^«»"“”'‘’]{6,})[»"“”'‘’]/g; let m;
  while ((m = re.exec(t))) out.push(m[1]);
  return out;
}
const EXAGERA = ["carga contra","carga","senala","critica","ataca","estalla","explota","rajada","zasca","dardo","bronca","pulla","arremete","dispara contra","contra sus companeros","companeros","vestuario","vinicius","mbappe","bellingham","guerra","polemica"];
// Corrige un titular y devuelve [{txt, pts, max}] con lo que ha encontrado
function corregir(mat, titular){
  const t = n3(titular), L = soloLetras(titular), items = [];
  const add = (txt, ok, pts) => items.push({ txt, pts: ok ? pts : 0, max: pts });
  if (!L) return [{ txt:"Sin titular", pts:0, max:30 }];
  if (mat.kind === "seo"){
    add("Dice a qué hora (lo que busca la gente)", /\b(hora|horario|cuando (se )?juega)\b/.test(L), 15);
    const madrid = /\bmadrid\b/.test(L), barca = /\b(barcelona|barca)\b/.test(L);
    add("Nombra a los dos equipos", madrid && barca, 10);
    add("Dice dónde verlo", /\b(donde (verlo|ver)|tv|television|canal|retransmision|en directo)\b/.test(L), 5);
    return items;
  }
  const original = " " + soloLetras([mat.title || ""].concat(mat.body.map(x => x.split("|").pop())).join(" ")) + " ";
  const cs = citas(titular).map(soloLetras).filter(Boolean);
  // La cita vale si sus palabras están en el material y hay un trozo seguido de al menos 4 palabras (se permite unir dos frases)
  const fiel = c => { const w = c.split(" "); if (w.length < 3) return false;
    const dentro = w.filter(x => original.includes(" " + x + " ")).length / w.length;
    let mejor = 0; for (let i = 0; i < w.length; i++) for (let j = w.length; j > i + mejor; j--) if (original.includes(" " + w.slice(i, j).join(" ") + " ")) { mejor = j - i; break; }
    return dentro >= 0.85 && mejor >= Math.min(4, w.length); };
  const literal = cs.some(fiel);
  const roja = EXAGERA.find(w => L.includes(w));
  if (mat.kind === "ig"){
    add("Lleva el nombre (Valverde)", /\bvalverde\b/.test(L), 5);
    add("Lleva el cargo (capitán del Real Madrid)", /\b(capitan|real madrid|madridista)\b/.test(L), 5);
    add("Cita entre comillas, palabra por palabra", literal, 15);
    add("Elige la frase fuerte", cs.some(c => /cansado de correr|quien quiere de verdad/.test(c)) && literal, 5);
  } else {
    add("Lleva el nombre (Pedri)", /\bpedri\b/.test(L), 5);
    add("Cita entre comillas, palabra por palabra", literal, 10);
    add("Encuentra la perla (el abuelo, enterrada en la quinta pregunta)", literal && cs.some(c => /abuelo|del barcelona|del barca|nieto/.test(c)), 15);
  }
  if (roja) return [{ txt:`Línea roja: exagera lo que dice el material («${roja}»)`, pts:0, max:30 }].concat(items.map(i => Object.assign({}, i, { pts:0 })));
  return items;
}
const total = items => items.reduce((s, i) => s + i.pts, 0);

}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Emisora · Boletines y conexiones en directo</title>
<style>
  :root{
    --red:#C8102E;--dark:#1B1B1F;--ink:#2B2B30;
    --paper:#fff;--tint:#FBF1F2;--gold:#E8B54A;
    --muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--bg:#F5F5F7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .topbar{background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:56px;gap:10px;flex-wrap:wrap}
  .topbar-left{display:flex;flex-direction:column;justify-content:center}
  .topbar-title{font-size:15px;font-weight:700;letter-spacing:.03em}
  .topbar-sub{font-size:10px;color:var(--gold);letter-spacing:.06em}
  .topbar-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .tbtn:hover{background:rgba(255,255,255,.22)}
  .tbtn.on{background:var(--gold);color:var(--dark);border-color:var(--gold)}
  .tbtn:disabled{opacity:.35;cursor:not-allowed}
  .tbtn-red{background:var(--red);border-color:var(--red);font-weight:700}

  .stage{max-width:760px;margin:0 auto;padding:26px 16px 60px;display:flex;flex-direction:column;gap:18px;align-items:center}
  .panel{background:#fff;border-radius:14px;border:1px solid var(--border);width:100%;overflow:hidden}
  .panel-head{background:var(--dark);color:#fff;padding:11px 18px;font-size:12px;font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .panel-body{padding:22px}
  .field{margin-bottom:16px}
  .field > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .field input[type=text],.field input[type=number],.field select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff}
  .field input:focus,.field select:focus{outline:none;border-color:var(--red)}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .formatos{display:flex;gap:8px;flex-wrap:wrap}
  .formato{border:2px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
  .formato small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
  .formato.on{border-color:var(--red);background:var(--tint)}
  .sel-fila{display:flex;gap:8px;align-items:center}
  .sel-fila select{flex:1;min-width:0}
  .mini-oir{border:none;background:var(--gold);color:var(--dark);font-weight:700;border-radius:8px;padding:10px 12px;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap}
  .orden{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 0 18px}
  .orden span.p{background:var(--bg);border-radius:14px;padding:4px 10px;color:var(--ink);font-weight:600}
  .orden span.p.vivo{background:var(--red);color:#fff}

  .big-btn{border:none;padding:20px 40px;border-radius:16px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:var(--red);letter-spacing:.02em}
  .big-btn:hover{opacity:.9}
  .big-btn.dark{background:var(--dark)}
  .status-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.05em}
  .status-badge.idle{background:var(--bg);color:var(--muted)}
  .status-badge.live{background:var(--red);color:#fff}
  .status-badge.playing{background:var(--gold);color:var(--dark)}
  .status-badge.done{background:var(--green);color:#fff}
  .stage-center{text-align:center;width:100%}
  .stage-center .icon{font-size:56px;margin-bottom:6px}
  .stage-center h2{font-size:20px;font-weight:700;margin:8px 0 6px}
  .stage-center p{font-size:14px;color:var(--muted);line-height:1.6;max-width:480px;margin:0 auto}

  .timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
  .timer-circle{position:relative;width:220px;height:220px}
  .timer-circle svg{transform:rotate(-90deg)}
  .timer-ring-bg{fill:none;stroke:var(--bg);stroke-width:14}
  .timer-ring{fill:none;stroke:var(--red);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
  .timer-ring.warn{stroke:var(--gold)}
  .timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--ink)}
  .rec-pulse{width:14px;height:14px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .warn-banner{background:var(--gold);color:var(--dark);font-weight:700;border-radius:10px;padding:12px 18px;font-size:15px;display:none;animation:flash 1s infinite;text-align:center}
  .warn-banner.show{display:block}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion: reduce){.rec-pulse,.warn-banner{animation:none}}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .btn{border:none;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-outline{background:#fff;border:2px solid var(--border);color:var(--ink)}
  .btn-outline:hover{border-color:var(--red);color:var(--red)}
  .btn-dark{background:var(--dark);color:#fff}
  audio{width:100%;margin:14px 0}
  .nota-pie{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

  #toastWrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,92vw)}
  .toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;text-align:center;line-height:1.4}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.warn{background:var(--red)}

  /* SONIDOS Y CORTES */
  .intro-txt{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  .btn-add{display:inline-block;background:var(--dark);color:#fff;border:none;padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-add.rec{background:var(--red)}
  .btn-add:hover{opacity:.9}
  .grabando{margin-top:12px;background:var(--tint);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--red)}
  .serie{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg);font-size:14px}
  .serie .nom{flex:1;min-width:0}
  .serie .tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--bg);border-radius:10px;padding:2px 8px}
  .corte{border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-top:14px;background:#fff}
  .corte-cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .corte-num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .corte-cab input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;font-size:14px;font-family:inherit;font-weight:700;color:var(--ink)}
  .corte-cab input:focus{outline:none;border-color:var(--red)}
  .corte-del{border:none;background:none;color:var(--red);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
  .onda{display:block;width:100%;height:78px;border-radius:8px;background:var(--bg);touch-action:none;cursor:ew-resize}
  .corte-fila{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:9px;font-size:12.5px;color:var(--ink)}
  .corte-fila label{display:flex;align-items:center;gap:5px;font-weight:600}
  .corte-fila input[type=number]{width:74px;border:1.5px solid var(--border);border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit}
  .corte-fila input[type=range]{width:110px;accent-color:var(--red)}
  .corte-dur{font-weight:700;color:var(--red)}
  .btn-oir{border:none;background:var(--gold);color:var(--dark);font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13px}
  .cargando{font-size:13px;color:var(--muted);margin-top:12px}
  .directo-cortes{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
  .directo-cortes h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;text-align:center}
  .directo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .btn-lanzar{position:relative;overflow:hidden;border:none;border-radius:12px;padding:16px 12px;background:var(--dark);color:#fff;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left;line-height:1.3}
  .btn-lanzar small{display:block;font-weight:400;opacity:.75;font-size:12px;margin-top:3px}
  .btn-lanzar.sonando{background:var(--red)}
  .btn-lanzar .barra{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);width:0}
  button:focus-visible,select:focus-visible,input:focus-visible,label.btn-add:focus-within{outline:3px solid var(--gold);outline-offset:2px}
</style>
<script>
/* ── Guardar archivos también en iPhone, iPad y Mac ── */
(function(){
  var ua = navigator.userAgent;
  var esIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var esSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);
  var esApple = esIOS || esSafari;
  function directa(blob, nombre){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  function compartir(blob, nombre){
    try{
      var f = new File([blob], nombre, {type: blob.type || 'application/octet-stream'});
      if(esIOS && navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).catch(function(e){ if(!e || e.name !== 'AbortError') directa(blob, nombre); });
        return;
      }
    }catch(e){}
    directa(blob, nombre);
  }
  window.guardarArchivo = function(blob, nombre){
    if(!esApple){ directa(blob, nombre); return; }
    // En Apple pedimos un toque más: así Safari nunca bloquea la descarga
    var viejo = document.getElementById('gaCapa'); if(viejo) viejo.remove();
    var capa = document.createElement('div');
    capa.id = 'gaCapa';
    capa.setAttribute('style','position:fixed;inset:0;background:rgba(20,20,24,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,Helvetica,sans-serif');
    capa.innerHTML =
      '<div style="background:#fff;color:#1B1B1F;border-radius:16px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)">' +
      '<div style="font-size:40px;margin-bottom:6px">📥</div>' +
      '<div style="font-size:19px;font-weight:800;margin-bottom:6px">Vuestro archivo está listo</div>' +
      '<div style="font-size:13px;color:#6B6B72;margin-bottom:16px;word-break:break-all">' + String(nombre).replace(/</g,'&lt;') + '</div>' +
      '<button id="gaSi" style="display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;background:#C8102E;color:#fff;cursor:pointer">Guardar archivo</button>' +
      (esIOS ? '<div style="font-size:12.5px;color:#6B6B72;margin-top:10px;line-height:1.45">En el menú que se abre, elegid <b>«Guardar en Archivos»</b>. También podéis mandarlo por correo o AirDrop.</div>' : '') +
      '<button id="gaNo" style="margin-top:12px;border:0;background:none;color:#6B6B72;font-size:14px;cursor:pointer;text-decoration:underline">Cerrar</button>' +
      '</div>';
    document.body.appendChild(capa);
    document.getElementById('gaSi').onclick = function(){ compartir(blob, nombre); setTimeout(function(){ capa.remove(); }, 400); };
    document.getElementById('gaNo').onclick = function(){ capa.remove(); };
  };
})();
</script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">LA EMISORA</div>
    <div class="topbar-sub">BOLETINES Y CONEXIONES EN DIRECTO · V2</div>
  </div>
  <div class="topbar-right">
    <button class="tbtn" id="navEmitir" onclick="irA('emitir')">📻 Emitir</button>
    <button class="tbtn" id="navCortes" onclick="irA('cortes')">✂ Cortes</button>
    <button class="tbtn" id="navSonidos" onclick="irA('sonidos')">🎚 Entradas y salidas</button>
    <span class="status-badge idle" id="statusBadge">LISTO PARA CONFIGURAR</span>
    <button class="tbtn tbtn-red" id="resetBtn" onclick="resetAll()">↺ Nueva emisión</button>
  </div>
</div>

<div class="stage" id="stage"></div>
<div id="toastWrap"></div>

  const t = document.createElement('div');
  t.className = 'toast' + (warn ? ' warn' : '');
  t.textContent = msg;
  wrap.appendChild(t);

}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function slug(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function mmss(s){ s = Math.max(0, s); const m = Math.floor(s/60), r = s - m*60; return m + ':' + r.toFixed(1).padStart(4, '0'); }
function asegurarCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function decodificar(ab){
  return new Promise((res, rej) => {
    try{
      const p = asegurarCtx().decodeAudioData(ab, res, rej);
      if(p && p.then) p.then(res, rej);
    }catch(e){ rej(e); }
  });
}
function base64ToArrayBuffer(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function renderOffline(dur, fn){
  const sr = 44100;
  const ctx = new OfflineAudioContext(2, Math.ceil(dur*sr), sr);
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  fn(ctx, master);
  return await ctx.startRendering();
}
function pip(ctx, dest, time, freq, len, gainVal){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(gainVal, time + 0.012);
  g.gain.setValueAtTime(gainVal, time + len - 0.02);
  g.gain.linearRampToValueAtTime(0, time + len);
  osc.connect(g); g.connect(dest);
  osc.start(time); osc.stop(time + len + 0.03);
}
function brass(ctx, dest, freq, t0, d, gainVal){
  const osc = ctx.createOscillator(), filt = ctx.createBiquadFilter(), g = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = freq;
  filt.type = 'lowpass'; filt.frequency.value = 2200; filt.Q.value = 0.7;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gainVal, t0 + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  osc.connect(filt); filt.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + d + 0.05);
}
const SINTE = {
  pips5: () => renderOffline(4.9, (c, m) => { for(let i = 0; i < 4; i++) pip(c, m, i, 1000, 0.18, 0.55); pip(c, m, 4, 1400, 0.8, 0.65); }),
  pips6: () => renderOffline(5.9, (c, m) => { for(let i = 0; i < 5; i++) pip(c, m, i, 1000, 0.1, 0.55); pip(c, m, 5, 1000, 0.5, 0.6); }),
  pips3: () => renderOffline(1.6, (c, m) => { for(let i = 0; i < 2; i++) pip(c, m, i*0.45, 1000, 0.12, 0.55); pip(c, m, 0.9, 1400, 0.5, 0.6); }),
  fanfarria: () => renderOffline(3.9, (c, m) => {
    [392.00, 523.25, 659.25, 783.99].forEach((f, i) => brass(c, m, f, 0.1 + i*0.22, 0.9, 0.28));
    [392.00, 523.25, 659.25, 783.99, 987.77].forEach(f => brass(c, m, f, 1.1, 2.6, 0.15));
  }),
  cierre: () => renderOffline(6.5, (c, m) => {
    const notes = [783.99, 659.25, 523.25, 392.00];
    notes.forEach((f, i) => brass(c, m, f, 0.15 + i*0.30, 1.0, 0.28));
    const chordStart = 0.15 + notes.length*0.30 + 0.2;
    [392.00, 523.25, 659.25, 783.99, 987.77].forEach(f => brass(c, m, f, chordStart, 2.8, 0.16));
    pip(c, m, chordStart + 2.8 - 0.35, 1000, 0.22, 0.4);
  })
};

// Devuelve el AudioBuffer de un sonido (de serie o guardado)
const cacheSerie = {};
async function bufferDe(id){
  if(!id) return null;
  const s = DE_SERIE.find(x => x.id === id);
  if(s){
    if(!cacheSerie[id]) cacheSerie[id] = s.synth ? SINTE[s.synth]() : decodificar(base64ToArrayBuffer(B64[s.b64]));
    return await cacheSerie[id];
  }
  const it = items.find(x => x.id === id);
  return it && it.buffer ? it : null;
}
function sonidoDe(id){ return DE_SERIE.find(x => x.id === id) || items.find(x => x.id === id) || null; }

// ================= ALMACÉN EN EL DISPOSITIVO =================
const DB_NAME = 'la-emisora', STORE = 'items';
let dbPromise = null;
function db(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    try{
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: 'id'});
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbPromise;
}
async function dbTx(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbAll(){ try{ return (await dbTx('readonly', st => st.getAll())) || []; }catch(e){ return []; } }
async function dbPut(o){ try{ await dbTx('readwrite', st => st.put(o)); return true; }catch(e){ return false; } }
async function dbDel(id){ try{ await dbTx('readwrite', st => st.delete(id)); }catch(e){} }
function paraGuardar(it){
  return {id: it.id, kind: it.kind, nombre: it.nombre, blob: it.blob, ini: it.ini, fin: it.fin, vol: it.vol,
          suave: it.suave, bajarMicro: it.bajarMicro, created: it.created};
}
const timersGuardar = {};
function guardarItem(it){
  clearTimeout(timersGuardar[it.id]);
  timersGuardar[it.id] = setTimeout(() => dbPut(paraGuardar(it)), 400);
}

// Lee los cortes y entradas que La Conexión tenía guardados en este mismo ordenador
function leerBDAntigua(){
  return new Promise(res => {
    try{
      const r = indexedDB.open('conexion-politica-cortes', 1);
      r.onupgradeneeded = () => { try{ r.transaction.abort(); }catch(e){} res([]); };
      r.onerror = () => res([]);
      r.onsuccess = () => {
        try{
          const d = r.result;
          if(!d.objectStoreNames.contains('items')){ d.close(); res([]); return; }
          const q = d.transaction('items', 'readonly').objectStore('items').getAll();
          q.onsuccess = () => { d.close(); res(q.result || []); };
          q.onerror = () => { d.close(); res([]); };
        }catch(e){ res([]); }
      };
    }catch(e){ res([]); }
  });
}

async function cargarGuardados(){
  let todos = await dbAll();
  if(!todos.find(x => x.id === '__migrado')){
    const viejos = await leerBDAntigua();
    for(const v of viejos){
      if(!v.blob) continue;
      const nuevo = {id: 'm' + v.id, kind: v.kind === 'corte' ? 'corte' : 'voz',
        nombre: v.kind === 'corte' ? (v.name || 'Corte') : 'Entrada grabada en La Conexión',
        blob: v.blob, ini: 0, fin: null, vol: 1, suave: true, bajarMicro: true, created: v.created || Date.now()};
      await dbPut(nuevo);
    }
    await dbPut({id: '__migrado', kind: 'meta', created: Date.now()});
    todos = await dbAll();
  }
  const lista = todos.filter(x => x.kind !== 'meta' && x.blob).sort((a, b) => a.created - b.created);
  cargando += lista.length;
  render();
  for(const g of lista){
    try{
      const buf = await decodificar(await g.blob.arrayBuffer());
      const it = Object.assign({}, g, {buffer: buf, picos: calcularPicos(buf, 800)});
      if(it.fin == null || it.fin > buf.duration) it.fin = buf.duration;
      if(!(it.ini >= 0) || it.ini >= it.fin) it.ini = 0;
      items.push(it);
    }catch(e){}
    cargando--;
  }
  items.sort((a, b) => a.created - b.created);
  for(const k of Object.keys(sel)){ if(sel[k] && !sonidoDe(sel[k])) sel[k] = ''; }
  render();
}

// ================= EDITOR DE SONIDOS =================
function calcularPicos(buf, n){
  const ch = [];
  for(let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const paso = Math.max(1, Math.floor(buf.length / n));
  const picos = new Float32Array(n);
  let max = 0;
  for(let i = 0; i < n; i++){
    let m = 0;
    const a = i * paso, b = Math.min(buf.length, a + paso);
    for(let j = a; j < b; j += 8){ for(const d of ch){ const v = Math.abs(d[j]); if(v > m) m = v; } }
    picos[i] = m; if(m > max) max = m;
  }
  if(max > 0) for(let i = 0; i < n; i++) picos[i] /= max;
  return picos;
}
async function añadirItem(kind, blob, nombre){
  const buf = await decodificar(await blob.arrayBuffer());
  if(!buf || !buf.duration) throw new Error('vacío');
  const it = {id: 'i' + Date.now() + Math.random().toString(36).slice(2, 6), kind, nombre,
    blob, ini: 0, fin: buf.duration, vol: 1, suave: kind === 'corte', bajarMicro: true, created: Date.now(),
    buffer: buf, picos: calcularPicos(buf, 800)};
  items.push(it);
  const ok = await dbPut(paraGuardar(it));
  if(!ok) toast('Se usará mientras la página siga abierta, porque este navegador no deja guardarlo.', true);
  return it;
}
async function subirArchivos(kind, lista){
  const archivos = [...lista];
  if(!archivos.length) return;
  asegurarCtx();
  cargando += archivos.length;
  render();
  for(const f of archivos){
    try{
      if(f.size > 400 * 1024 * 1024) throw new Error('grande');
      const it = await añadirItem(kind, f, f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 60));
      if(kind !== 'corte' && !sel[kind]) sel[kind] = it.id;
    }catch(e){
      toast('No he podido sacar el sonido de «' + f.name + '». ' +
        (e && e.message === 'grande' ? 'Es demasiado grande, recortad el vídeo antes.' :
         'Probad desde Chrome o guardad el audio en otro formato (mp3, m4a o wav).'), true);
    }
    cargando--;
    render();
  }
}
async function grabar(kind){
  if(grabadora){ grabadora.rec.stop(); return; }
  asegurarCtx();
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch(e){ toast('No se ha podido acceder al micrófono. Revisa el permiso del navegador.', true); return; }
  const g = {kind, stream, chunks: [], t0: performance.now()};
  g.rec = nuevoRecorder(stream);
  g.rec.ondataavailable = e => { if(e.data && e.data.size > 0) g.chunks.push(e.data); };
  g.rec.onstop = async () => {
    clearInterval(g.tick);
    stream.getTracks().forEach(t => t.stop());
    grabadora = null;
    try{
      const blob = new Blob(g.chunks, {type: g.rec.mimeType || 'audio/webm'});
      const n = items.filter(x => x.kind === kind).length + 1;
      const it = await añadirItem(kind, blob, (kind === 'corte' ? 'Corte grabado ' : TIPOS[kind].una.charAt(0).toUpperCase() + TIPOS[kind].una.slice(1) + ' grabada ') + n);
      if(kind !== 'corte') sel[kind] = it.id;
      toast('Grabación guardada. Recortadla arrastrando las marcas rojas.');
    }catch(e){ toast('No se ha podido procesar la grabación.', true); }
    render();
  };
  g.rec.start();
  grabadora = g;
  render();
  g.tick = setInterval(() => { const x = document.getElementById('relojGrab'); if(x) x.textContent = mmss((performance.now() - g.t0) / 1000); }, 200);
}
function nuevoRecorder(stream){
  let m = '';
  for(const c of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){ m = c; break; }
  }
  try{ return m ? new MediaRecorder(stream, {mimeType: m}) : new MediaRecorder(stream); }
  catch(e){ return new MediaRecorder(stream); }
}

// Programa un tramo de un sonido en un contexto (en vivo o en el montaje)
function programarTramo(ctx, dest, c, cuando, dur){
  const src = ctx.createBufferSource();
  src.buffer = c.buffer;
  const g = ctx.createGain();
  src.connect(g); g.connect(dest);
  const f = c.suave ? Math.min(0.35, dur / 4) : 0.01;
  g.gain.setValueAtTime(0, cuando);
  g.gain.linearRampToValueAtTime(c.vol, cuando + f);
  g.gain.setValueAtTime(c.vol, Math.max(cuando + f, cuando + dur - f));
  g.gain.linearRampToValueAtTime(0, cuando + dur);
  src.start(cuando, c.ini, dur);
  src.stop(cuando + dur + 0.02);
  return {src, g};
}
// Convierte cualquier sonido en {buffer, ini, fin, vol, suave} listo para programar
async function tramoDe(id){
  const s = DE_SERIE.find(x => x.id === id);
  if(s){ const b = await bufferDe(id); return b ? {buffer: b, ini: 0, fin: b.duration, vol: 1, suave: false} : null; }
  const it = items.find(x => x.id === id);
  return it && it.buffer ? it : null;
}

function pararPreescucha(){
  if(!preescucha) return;
  try{ preescucha.src.stop(); }catch(e){}
  const p = preescucha;
  preescucha = null;
  document.querySelectorAll('[data-oir]').forEach(b => { if(b.dataset.oir === p.id) b.textContent = '▶ Escuchar'; });
  if(p.item) dibujarOnda(p.item);
}
async function preescuchar(id){
  const era = preescucha && preescucha.id === id;
  pararPreescucha();
  if(era) return;
  const t = await tramoDe(id);
  if(!t) return;
  const ctx = asegurarCtx();
  const cuando = ctx.currentTime + 0.05;
  const {src} = programarTramo(ctx, ctx.destination, t, cuando, t.fin - t.ini);
  const item = items.find(x => x.id === id) || null;
  preescucha = {src, id, item, inicioCtx: cuando};
  src.onended = () => { if(preescucha && preescucha.src === src) pararPreescucha(); };
  document.querySelectorAll('[data-oir]').forEach(b => { if(b.dataset.oir === id) b.textContent = '⏹ Parar'; });
  if(item) (function anima(){
    if(!preescucha || preescucha.src !== src) return;
    dibujarOnda(item, item.ini + (asegurarCtx().currentTime - cuando));
    requestAnimationFrame(anima);
  })();
}

function dibujarOnda(c, cabezal){
  const cv = document.querySelector('canvas[data-onda="' + c.id + '"]');
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w) return;
  if(cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const x = cv.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const D = c.buffer.duration;
  const xi = c.ini / D * w, xf = c.fin / D * w;
  x.fillStyle = 'rgba(200,16,46,.10)';
  x.fillRect(xi, 0, xf - xi, h);
  const n = c.picos.length;
  for(let i = 0; i < w; i++){
    const p = c.picos[Math.min(n - 1, Math.floor(i / w * n))];
    const alto = Math.max(1, p * (h - 10));
    x.fillStyle = (i >= xi && i <= xf) ? '#2B2B30' : '#C4C4CA';
    x.fillRect(i, (h - alto) / 2, 1, alto);
  }
  x.fillStyle = '#C8102E';
  [Math.max(1.5, xi), Math.min(w - 1.5, xf)].forEach(px => {
    x.fillRect(Math.round(px) - 1.5, 0, 3, h);
    x.fillRect(Math.round(px) - 7, 0, 14, 12);
    x.fillRect(Math.round(px) - 7, h - 12, 14, 12);
  });
  if(cabezal !== undefined){ x.fillStyle = '#E8B54A'; x.fillRect(cabezal / D * w - 1, 0, 2, h); }
}

function activarTarjetas(raiz){
  raiz.querySelectorAll('[data-corte]').forEach(card => {
    const c = items.find(x => x.id === card.dataset.corte);
    if(!c) return;
    card.querySelector('[data-nombre]').addEventListener('input', e => { c.nombre = e.target.value; guardarItem(c); });
    const ini = card.querySelector('.in-ini'), fin = card.querySelector('.in-fin');
    ini.addEventListener('change', () => { c.ini = Math.min(Math.max(0, parseFloat(ini.value) || 0), c.fin - 0.2); actualizarDatos(c); dibujarOnda(c); guardarItem(c); });
    fin.addEventListener('change', () => { c.fin = Math.max(Math.min(c.buffer.duration, parseFloat(fin.value) || c.buffer.duration), c.ini + 0.2); actualizarDatos(c); dibujarOnda(c); guardarItem(c); });
    const vol = card.querySelector('.in-vol');
    vol.addEventListener('input', () => { c.vol = parseFloat(vol.value); card.querySelector('.vol-txt').textContent = Math.round(c.vol * 100) + '%'; guardarItem(c); });
    card.querySelector('.in-suave').addEventListener('change', e => { c.suave = e.target.checked; guardarItem(c); });
    const mic = card.querySelector('.in-micro');
    if(mic) mic.addEventListener('change', e => { c.bajarMicro = e.target.checked; guardarItem(c); });
    const cv = card.querySelector('canvas');
    let asa = null;
    const tiempo = ev => { const r = cv.getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * c.buffer.duration; };
    const mover = ev => {
      if(!asa) return;
      const t = tiempo(ev);
      if(asa === 'ini') c.ini = Math.min(t, c.fin - 0.2); else c.fin = Math.max(t, c.ini + 0.2);
      actualizarDatos(c); dibujarOnda(c);
    };
    cv.addEventListener('pointerdown', ev => {
      const t = tiempo(ev);
      asa = Math.abs(t - c.ini) <= Math.abs(t - c.fin) ? 'ini' : 'fin';
      cv.setPointerCapture(ev.pointerId); mover(ev); ev.preventDefault();
    });
    cv.addEventListener('pointermove', mover);
    const soltar = () => { if(asa){ asa = null; guardarItem(c); } };
    cv.addEventListener('pointerup', soltar);
    cv.addEventListener('pointercancel', soltar);
    actualizarDatos(c);
    dibujarOnda(c);
  });
}

// ================= EN DIRECTO =================
function cortes(){ return items.filter(x => x.kind === 'corte'); }
function segundosGrabados(){ return (performance.now() - recStart) / 1000; }
function lanzarCorte(i){
  if(phase !== 'recording') return;
  const c = cortes()[i];
  if(!c) return;
  const mismo = sonando && sonando.d.c === c;
  pararCorte();
  if(mismo) return;
  const ctx = asegurarCtx();
  const dur = c.fin - c.ini, cuando = ctx.currentTime + 0.02;
  const {src, g} = programarTramo(ctx, ctx.destination, c, cuando, dur);
  const d = {c, t: segundosGrabados() + 0.02, dur};
  disparos.push(d);
  sonando = {src, g, d, inicioCtx: cuando};
  src.onended = () => { if(sonando && sonando.src === src){ sonando = null; pintarBotonesDirecto(); } };
  pintarBotonesDirecto();
  (function anima(){
    if(!sonando || sonando.src !== src) return;
    const b = document.querySelector('[data-lanzar="' + i + '"] .barra');
    if(b) b.style.width = Math.min(100, (ctx.currentTime - cuando) / dur * 100) + '%';
    requestAnimationFrame(anima);
  })();
}
function pararCorte(){
  if(!sonando) return;
  const s = sonando;
  sonando = null;
  const ctx = asegurarCtx();
  const pasado = ctx.currentTime - s.inicioCtx;
  if(pasado < s.d.dur){
    s.d.dur = Math.max(0.05, pasado + 0.15);
    try{
      s.g.gain.cancelScheduledValues(ctx.currentTime);
      s.g.gain.setValueAtTime(s.g.gain.value, ctx.currentTime);
      s.g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
      s.src.stop(ctx.currentTime + 0.16);
    }catch(e){ try{ s.src.stop(); }catch(e2){} }
  }
  pintarBotonesDirecto();
}
function htmlDirecto(){
  const cs = cortes();
  if(!cs.length) return '';
  return `<div class="directo-cortes">
      <h3>VUESTROS CORTES · PULSAD PARA QUE SUENEN, OTRA VEZ PARA PARARLOS</h3>
      <div class="directo-grid">${cs.map((c, i) => `
        <button class="btn-lanzar" data-lanzar="${i}" onclick="lanzarCorte(${i})">

}
function pintarBotonesDirecto(){
  const cs = cortes();
  document.querySelectorAll('[data-lanzar]').forEach(b => {

}

// ================= WAV =================
function audioBufferToWav(buffer){
  const numCh = buffer.numberOfChannels, sr = buffer.sampleRate;
  const blockAlign = numCh * 2, dataLength = buffer.length * blockAlign;
  const view = new DataView(new ArrayBuffer(44 + dataLength));
  const w = (o, s) => { for(let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); view.setUint32(4, 36 + dataLength, true); w(8,'WAVE');
  w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sr,true);
  view.setUint32(28, sr*blockAlign, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34,16,true); w(36,'data'); view.setUint32(40, dataLength, true);
  const ch = [];
  for(let c = 0; c < numCh; c++) ch.push(buffer.getChannelData(c));
  let off = 44;
  for(let i = 0; i < buffer.length; i++){
    for(let c = 0; c < numCh; c++){
      const s = Math.max(-1, Math.min(1, ch[c][i]));
      view.setInt16(off, s < 0 ? s*0x8000 : s*0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([view], {type: 'audio/wav'});
}

// ================= FLUJO =================
function setDur(n){
  n = parseInt(n, 10);
  if(isNaN(n) || n < 15) n = 15;
  if(n > 600) n = 600;
  durationSec = n; timeLeft = n; warnAt = n <= 120 ? 15 : 30;
  const h = document.getElementById('durHint');
  if(h) h.textContent = descripcionDuracion(n);
}
function descripcionDuracion(n){
  const mm = Math.floor(n/60), ss = n%60;
  const txt = mm ? `${mm} min${ss ? ' ' + ss + ' s' : ''}` : `${ss} segundos`;
  return `${txt} en directo. Aviso cuando queden ${n <= 120 ? 15 : 30} segundos. Se puede cerrar antes.`;
}
function elegirFormato(f){
  const F = FORMATOS[f];
  if(!F) return;
  formato = f;
  sel = Object.assign({}, F.sel);
  setDur(F.dur);

  render();
}
function elegir(kind, id){
  sel[kind] = id;
  formato = '';
  Object.keys(FORMATOS).forEach(k => { const F = FORMATOS[k]; if(Object.keys(sel).every(x => (F.sel[x] || '') === (sel[x] || ''))) formato = k; });
  introBuffer = null;
  guardarLocal();
  render();
}
async function ensureMic(){
  if(micStream && micStream.active) return true;
  try{ micStream = await navigator.mediaDevices.getUserMedia({audio: true}); return true; }
  catch(e){ toast('No se ha podido acceder al micrófono. Revisa el permiso del navegador.', true); return false; }
}
async function goReady(){
  if(grabadora){ toast('Terminad antes la grabación que tenéis en marcha.', true); return; }
  phase = 'ready';
  timeLeft = durationSec;
  render();
  setStatus('PIDIENDO PERMISO DEL MICRÓFONO...', 'idle');
  const ok = await ensureMic();
  setStatus(ok ? 'MICRÓFONO LISTO · A EMITIR' : 'SIN MICRÓFONO — REVISA EL PERMISO', ok ? 'idle' : 'live');
}
// Une señal horaria, sintonía y voz de entrada en un solo tramo
async function construirEntrada(){
  const partes = [];
  for(const k of ['senal', 'sintonia', 'voz']){ const t = await tramoDe(sel[k]); if(t) partes.push(t); }
  if(!partes.length) return null;
  const sr = 44100, hueco = 0.25;
  const total = partes.reduce((a, p) => a + (p.fin - p.ini), 0) + hueco * (partes.length - 1) + 0.1;
  const off = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
  let t = 0;
  partes.forEach(p => { programarTramo(off, off.destination, p, t, p.fin - p.ini); t += (p.fin - p.ini) + hueco; });
  return await off.startRendering();
}
async function construirSalida(){
  const p = await tramoDe(sel.salida);
  if(!p) return null;
  const sr = 44100, d = p.fin - p.ini;
  const off = new OfflineAudioContext(2, Math.ceil((d + 0.05) * sr), sr);
  programarTramo(off, off.destination, p, 0, d);
  return await off.startRendering();
}
function playBufferLive(buffer){
  return new Promise(resolve => {
    if(!buffer){ resolve(); return; }
    const ctx = asegurarCtx();
    const src = ctx.createBufferSource();
    src.buffer = buffer; src.connect(ctx.destination); src.onended = resolve; src.start();
  });
}
async function startEmission(){
  pararPreescucha();
  setStatus('PREPARANDO EL MICRÓFONO...', 'idle');
  if(!(await ensureMic())){ phase = 'error'; render(); return; }
  phase = 'intro';
  render();
  setStatus('SONANDO LA ENTRADA...', 'playing');
  try{
    introBuffer = await construirEntrada();
    outroBuffer = await construirSalida();
  }catch(e){
    toast('No se han podido preparar las entradas en este navegador.', true);
    phase = 'config'; render(); return;
  }
  await playBufferLive(introBuffer);
  await goLiveAndRecord();
}
async function goLiveAndRecord(){
  if(!(await ensureMic())){ phase = 'error'; render(); return; }
  recordedChunks = [];
  mediaRecorder = nuevoRecorder(micStream);
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
  disparos = [];
  sonando = null;
  recStart = performance.now();
  mediaRecorder.onstart = () => { recStart = performance.now(); };
  mediaRecorder.start();
  phase = 'recording';
  timeLeft = durationSec;
  showWarn = false;
  render();
  setStatus('EN DIRECTO', 'live');
  timerInterval = setInterval(() => {
    timeLeft--;
    if(timeLeft <= warnAt && timeLeft > 0) showWarn = true;
    if(timeLeft <= 0){ timeLeft = 0; stopRecording(); }
    renderTimerOnly();
  }, 1000);
}
async function stopRecording(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  pararCorte();
  if(!mediaRecorder || mediaRecorder.state === 'inactive') return;
  phase = 'mixing';
  render();
  setStatus('MONTANDO...', 'playing');
  const stopped = new Promise(r => { mediaRecorder.onstop = r; });
  mediaRecorder.stop();
  await stopped;
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  try{
    const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
    recordedBuffer = await decodificar(await blob.arrayBuffer());
  }catch(e){
    toast('No se ha podido procesar la grabación. Repetid la emisión.', true);
    phase = 'ready'; render(); setStatus('LISTO PARA EMITIR', 'idle'); return;
  }
  if(outroBuffer){
    phase = 'outro';
    render();
    setStatus('SONANDO LA SALIDA...', 'playing');
    await playBufferLive(outroBuffer);
  }
  await mixFinal();
}
async function mixFinal(){
  phase = 'mixing';
  render();
  setStatus('MONTANDO...', 'playing');
  const sr = 44100;
  const base = introBuffer ? introBuffer.duration : 0;
  const total = base + recordedBuffer.duration + (outroBuffer ? outroBuffer.duration : 0);
  const offline = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
  const place = (buf, t) => { const s = offline.createBufferSource(); s.buffer = buf; s.connect(offline.destination); s.start(t); };
  if(introBuffer) place(introBuffer, 0);
  if(outroBuffer) place(outroBuffer, base + recordedBuffer.duration);
  // La voz pasa por una ganancia para cerrar el micro mientras suena un corte
  const voz = offline.createBufferSource();
  voz.buffer = recordedBuffer;
  const vg = offline.createGain();
  voz.connect(vg); vg.connect(offline.destination);
  vg.gain.setValueAtTime(1, 0);
  let libre = 0;
  disparos.slice().sort((a, b) => a.t - b.t).forEach(d => {
    const dur = Math.min(d.dur, recordedBuffer.duration - d.t);
    if(dur <= 0.05) return;
    programarTramo(offline, offline.destination, d.c, base + d.t, dur);
    if(d.c.bajarMicro){
      const a = base + d.t, b = base + d.t + dur + 0.15;
      vg.gain.setValueAtTime(1, Math.max(libre, a - 0.06));
      vg.gain.linearRampToValueAtTime(0, a);
      vg.gain.setValueAtTime(0, b);
      vg.gain.linearRampToValueAtTime(1, b + 0.08);
      libre = b + 0.08;
    }
  });
  voz.start(base);
  const finalBuffer = await offline.startRendering();
  finalBlob = audioBufferToWav(finalBuffer);
  if(finalBlobUrl) URL.revokeObjectURL(finalBlobUrl);
  finalBlobUrl = URL.createObjectURL(finalBlob);
  phase = 'done';
  render();
  setStatus('EMISIÓN LISTA', 'done');
  toast('🎙 Emisión montada y lista para descargar.');
}

  if(mediaRecorder && mediaRecorder.state !== 'inactive'){ try{ mediaRecorder.stop(); }catch(e){} }
  disparos = []; recordedChunks = []; recordedBuffer = null;
  if(finalBlobUrl){ URL.revokeObjectURL(finalBlobUrl); finalBlobUrl = null; }

            ${htmlOrden()}
          </div>
          <div class="field">
            <label>Cortes preparados (${cortes().length})</label>
            <div class="hint">${cortes().length ? 'Durante el directo aparecerán como botones para lanzarlos cuando toque.' : 'Todavía no hay cortes. Se preparan en la pestaña «✂ Cortes».'}
              <a href="#" onclick="irA('cortes'); return false;" style="color:var(--red);font-weight:700">${cortes().length ? 'Editar cortes' : 'Preparar cortes'}</a></div>
          </div>
          ${cargando ? '<div class="cargando">Cargando sonidos guardados…</div>' : ''}
          <div style="text-align:center;margin-top:8px">
            <button class="big-btn dark" onclick="goReady()">Preparar emisión</button>
          </div>
          <div class="hint" style="text-align:center;margin-top:10px">El navegador pedirá permiso para usar el micrófono. Aceptadlo antes de empezar a hablar.</div>
        </div>
      </div>`;
    return;
  }

  if(phase === 'ready'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body stage-center">
        <div class="icon">📻</div>
        <h2>${etiqueta ? escapeHtml(etiqueta) : 'Todo listo para emitir'}</h2>
        ${htmlOrden()}
        <p>Al pulsar EMITIR sonará la entrada. En cuanto termine, el micrófono se abrirá solo y empezará la cuenta atrás de ${durationSec} s.
          ${cortes().length ? 'Tendréis un botón para lanzar cada uno de vuestros ' + cortes().length + (cortes().length === 1 ? ' corte.' : ' cortes.') : ''}</p>
        <div style="margin-top:22px"><button class="big-btn" onclick="startEmission()">🔴 EMITIR</button></div>
        <div class="btn-row"><button class="btn btn-outline" onclick="phase='config'; render(); setStatus('LISTO PARA CONFIGURAR','idle')">← Cambiar configuración</button></div>
      </div></div>`;
    return;
  }

  if(phase === 'intro'){
    el.innerHTML = `<div class="panel"><div class="panel-body stage-center">
        <div class="icon">🔔</div><h2>Sonando la entrada...</h2>
        <p>El micrófono se abrirá solo en cuanto termine. Preparaos.</p></div></div>`;
    return;
  }

  if(phase === 'recording'){
    el.innerHTML = `
      <div class="panel"><div class="panel-body">
        <div class="timer-wrap" id="timerWrap"></div>
        <div class="warn-banner ${showWarn ? 'show' : ''}" id="warnBanner">⏳ ¡QUEDAN ${warnAt} SEGUNDOS!</div>
        <div class="btn-row"><button class="big-btn dark" onclick="stopRecording()">⏹ Cerrar y devolver</button></div>
        ${htmlDirecto()}
      </div></div>`;
    renderTimerOnly();
    return;
  }

  if(phase === 'outro'){
    el.innerHTML = `<div class="panel"><div class="panel-body stage-center">
        <div class="icon">👋</div><h2>Sonando la salida...</h2><p>Se cierra la emisión.</p></div></div>`;
    return;
  }

  if(phase === 'mixing'){
    el.innerHTML = `<div class="panel"><div class="panel-body stage-center">
        <div class="icon">🎛️</div><h2>Montando la emisión...</h2>
        <p>Uniendo la entrada, vuestra grabación${disparos.length ? ' con sus cortes' : ''} y la salida en un solo archivo.</p></div></div>`;
    return;
  }

  if(phase === 'done'){
    const nombre = (slug(etiqueta) || (formato === 'boletin' ? 'boletin' : formato ? 'conexion_' + formato : 'emision')) + '.wav';
    el.innerHTML = `
      <div class="panel">
        <div class="panel-head"><span>EMISIÓN MONTADA ${etiqueta ? '· ' + escapeHtml(etiqueta) : ''}</span></div>
        <div class="panel-body stage-center">
          <div class="icon">✅</div>
          <h2>Ya está, todo en un solo archivo</h2>
          <audio controls src="${finalBlobUrl}"></audio>
          <div class="btn-row">
            <button class="btn btn-dark" onclick="guardarArchivo(finalBlob,'${nombre}')">⬇ Descargar (.wav)</button>
            <button class="btn btn-outline" onclick="resetAll()">↺ Grabar otra</button>
          </div>
          <div class="nota-pie">${cortes().length ? 'Los cortes se quedan preparados para la siguiente.' : ''}</div>
        </div>
      </div>`;
    return;
  }

  if(phase === 'error'){
    el.innerHTML = `<div class="panel"><div class="panel-body stage-center">
        <div class="icon">🎙️🚫</div><h2>No se ha podido acceder al micrófono</h2>
        <p>Revisad el permiso del micrófono en el navegador (el candado junto a la dirección) y volved a intentarlo.</p>
        <div class="btn-row"><button class="btn btn-dark" onclick="phase='ready'; render(); setStatus('LISTO PARA EMITIR','idle')">Reintentar</button></div>
      </div></div>`;
  }
}
function renderTimerOnly(){
  const wrap = document.getElementById('timerWrap');
  if(!wrap) return;
  const frac = durationSec > 0 ? timeLeft / durationSec : 0;
  const offset = TOTAL_CIRC * (1 - frac);
  const mm = Math.floor(timeLeft/60).toString().padStart(2,'0');
  const ss = (timeLeft%60).toString().padStart(2,'0');
  wrap.innerHTML = `
    <div class="timer-circle">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
        <circle class="timer-ring ${timeLeft <= warnAt ? 'warn' : ''}" cx="110" cy="110" r="100" stroke-dasharray="${TOTAL_CIRC}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="timer-num">${mm}:${ss}</div>
    </div>
    <div style="text-align:center;font-weight:700;color:var(--red)"><span class="rec-pulse"></span>EN DIRECTO</div>`;
  const banner = document.getElementById('warnBanner');
  if(banner) banner.className = 'warn-banner' + (showWarn ? ' show' : '');
}

// ================= ARRANQUE =================
leerLocal();
(function(){
  const h = (location.hash || '').replace('#', '');
  if(FORMATOS[h]){ formato = h; sel = Object.assign({}, FORMATOS[h].sel); setDur(FORMATOS[h].dur); }
})();
render();
cargarGuardados();
</script>
</body>
</html>

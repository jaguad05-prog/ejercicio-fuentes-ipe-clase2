<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>El vídeo bajo la lupa · Equipo</title>
<style>
:root{--red:#C8102E;--ink:#1B1B1F;--paper:#fff;--bg:#F3F1EC;--muted:#6B6B72;--border:#D8D8DC;--green:#1E7A45;--gold:#E8B54A;--soft:#FBF6E8;--team:#C8102E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
.top{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.t1{font-size:14px;font-weight:800;letter-spacing:.04em}
.t2{font-size:11px;color:var(--gold);letter-spacing:.06em}
.chip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;text-align:right}
.dot{width:16px;height:16px;border-radius:50%;background:var(--team);border:2px solid #fff;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:23px;line-height:1.2;margin-bottom:8px}
h2{font-size:18px;line-height:1.3;margin-bottom:10px}
p{line-height:1.45}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:15px;margin:16px 0 7px;line-height:1.35}
label .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:13px;margin-right:6px;vertical-align:1px}
input,textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:13px;font-size:17px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--team)}
textarea{min-height:80px;resize:vertical;line-height:1.4}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:18px;font-weight:800;font-family:inherit;color:#fff;background:var(--red);cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45}
.btn.team{background:var(--team)}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:20px;background:var(--ink);color:#fff}
.clock{margin-left:auto;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--red)}
.bloque{font-size:12px;color:var(--muted);margin-bottom:4px}
.qtext{font-size:21px;font-weight:800;line-height:1.25}
.pista{margin-top:14px;border:2px dashed var(--gold);background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.pista b{display:block;font-size:12px;letter-spacing:.08em;color:#9A6B00;margin-bottom:3px}
.sent .l{font-size:15px;line-height:1.45;margin-top:10px}
.sent .l b{color:var(--muted)}
.st{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-weight:700}
.st:last-child{border-bottom:none}
.st b{margin-left:auto;color:var(--red);font-size:18px}
.st.me{color:var(--team)}
.big{font-size:44px;text-align:center;margin:6px 0}
.center{text-align:center}
.pts{font-size:48px;font-weight:900;color:var(--team);text-align:center}
.small{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}
.small a{color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div><div class="t1">EL VÍDEO BAJO LA LUPA</div><div class="t2">IPE 2026 · CONCURSO</div></div>
  <div class="chip" id="chip"></div>
</div>
<div class="wrap" id="app"></div>

<script>
// ===== CONFIGURACIÓN =====
const API_URL = "https://script.google.com/macros/s/AKfycbxt2_VvCcqLx8KWNvV2wSqLnrdjZSfs0YP0yOwlvF5wTwQO0MqgXxypLdfKvFz4o2KS/exec";   // dirección /exec del servidor de Apps Script
// =========================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };

const qs = new URLSearchParams(location.search);
let API = qs.get("api") || (API_URL.startsWith("http") ? API_URL : "") || lsGet("vl_api", "");
let CODE = (qs.get("c") || lsGet("vl_eq_code", "")).toUpperCase();
let DEV = lsGet("vl_dev", "");
if (!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet("vl_dev", DEV); }
let unido = lsGet("vl_eq_joined", "") === CODE && !!CODE;
let S = null, vista = "", ocupado = false, finTiempo = 0;
const borradores = {}; // lo que vais escribiendo en cada pregunta no se pierde al refrescar

async function api(params){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(Object.assign({ c: CODE, dev: DEV }, params)) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function pintarEntrada(msg){
  $("chip").innerHTML = "";
  $("app").innerHTML = `<div class="card">
    <h1>Entra con tu equipo</h1>
    <p class="muted">Escribe el nombre de tu equipo exactamente igual que tus compañeros.</p>
    ${API ? "" : `<label>Dirección del servidor</label><input id="inApi" placeholder="https://script.google.com/macros/s/.../exec">`}
    <label>Código del concurso</label><input id="inCode" value="${esc(CODE)}" maxlength="6" autocapitalize="characters" placeholder="Lo ves en la pantalla">
    <label>Nombre de tu equipo</label><input id="inTeam" value="${esc(lsGet("vl_eq_name", ""))}" maxlength="30" placeholder="Ej: Los Plumillas">
    <button class="btn" id="btnJoin">Entrar</button>
    <div class="err" id="err">${esc(msg || "")}</div></div>`;
  $("btnJoin").onclick = entrar;
}
async function entrar(){
  if (!API) API = ($("inApi").value || "").trim();
  CODE = $("inCode").value.trim().toUpperCase();
  const name = $("inTeam").value.trim();
  if (!API || !CODE || !name){ $("err").textContent = "Rellena el código y el nombre del equipo"; return; }
  $("btnJoin").disabled = true; $("btnJoin").textContent = "Entrando…";
  try {
    await api({ a:"join", name });
    lsSet("vl_api", API); lsSet("vl_eq_code", CODE); lsSet("vl_eq_name", name); lsSet("vl_eq_joined", CODE);
    unido = true; vista = ""; await refrescar();
  } catch(e){ $("err").textContent = e.message; $("btnJoin").disabled = false; $("btnJoin").textContent = "Entrar"; }
}
function cambiarEquipo(){ unido = false; lsSet("vl_eq_joined", ""); S = null; pintarEntrada(); }

let pidiendo = false;
async function refrescar(){
  if (!unido || pidiendo) return;
  pidiendo = true;
  try {
    S = await api({ a:"state" });
    if (!S.me){ unido = false; pintarEntrada("Vuelve a entrar con el nombre de tu equipo"); return; }
    if (S.game.status === "answer") finTiempo = Date.now() + S.game.remaining * 1000;
    pintar();
  } catch(e){ if (/No existe/.test(e.message)){ unido = false; pintarEntrada(e.message); } }
  finally { pidiendo = false; }
}
setInterval(refrescar, 3000 + Math.floor(Math.random() * 1500));
setInterval(reloj, 500);

function guardarBorrador(){
  if (!S || !S.game.q) return;
  const k = S.game.idx;
  borradores[k] = [...document.querySelectorAll(".resp")].map(t => t.value);
}

function pintar(){
  const g = S.game, me = S.me;
  document.documentElement.style.setProperty("--team", me.color);
  $("chip").innerHTML = `<span>${esc(me.teamName)}</span><span class="dot"></span>`;

  // No se repinta mientras escribís (solo cambia si cambia la pregunta, la pista o el estado)
  const clave = JSON.stringify([g.status, g.idx, !!me.sent, g.myPts, g.status === "review" || g.status === "over" || g.status === "lobby" ? S.teams.map(t => t.pts + t.name) : 0]);
  if (clave === vista){
    // La pista se añade sin repintar, para no quitaros el cursor mientras escribís
    if (g.status === "answer" && g.pista && !document.querySelector(".pista") && $("qcard")){
      $("qcard").insertAdjacentHTML("beforeend", `<div class="pista"><b>💡 PISTA</b>${esc(g.pista)}</div>`);
    }
    return;
  }
  if (vista && g.status === "answer") guardarBorrador();
  vista = clave;

  const pie = `<div class="small">Equipo: ${esc(me.teamName)} · <a href="#" onclick="cambiarEquipo();return false">cambiar de equipo</a></div>`;
  let html = "";
  if (g.status === "lobby"){
    html = g.idx < 0
      ? `<div class="card center"><div class="big">🎬</div><h1>¡Dentro!</h1><p class="muted">Estáis en <b>${esc(me.teamName)}</b>. Esperad a que la profesora lance la primera pregunta.</p></div>`
      : `<div class="card center"><div class="big">⏳</div><h2>Preparados para la siguiente pregunta</h2><p class="muted">En cuanto la profesora la lance, os aparece aquí.</p></div>` + tarjetaClasificacion();
  } else if (g.status === "answer"){
    html = tarjetaPregunta();
    if (me.sent){
      html += `<div class="card sent"><h2>✓ Respuesta enviada</h2><p class="muted">Ya no se puede cambiar. Esperad a que cierre el tiempo.</p>
        ${g.q.guides.map((gq, i) => `<div class="l"><b>${i + 1}. ${esc(gq)}</b><br>${esc(me.sent[i] || "(en blanco)")}</div>`).join("")}</div>`;
    } else {
      const b = borradores[g.idx] || [];
      html += `<div class="card"><h2>Vuestra respuesta</h2>
        <p class="muted">Contestad a cada casilla con lo que veis en el vídeo. Basta con que envíe un móvil por equipo.</p>
        ${g.q.guides.map((gq, i) => `<label for="r${i}"><span class="n">${i + 1}</span>${esc(gq)}</label>
          <textarea class="resp" id="r${i}" maxlength="700" placeholder="Escribid aquí…">${esc(b[i] || "")}</textarea>`).join("")}
        <button class="btn team" id="btnSend">Enviar respuesta</button>
        <div class="err" id="err"></div></div>`;
    }
  } else if (g.status === "review"){
    html = `<div class="card center"><div class="big">🖥️</div><h2>Tiempo terminado</h2><p class="muted">Mirad el proyector: la profesora está corrigiendo.</p>
      ${g.myPts != null ? `<p class="muted" style="margin-top:12px">Vuestros puntos en esta pregunta</p><div class="pts">+${g.myPts}</div>` : ""}</div>` + tarjetaClasificacion();
  } else if (g.status === "over"){
    const ord = [...S.teams].sort((a, b) => b.pts - a.pts);
    html = `<div class="card center"><div class="big">🏆</div><h1>${esc(ord[0] ? ord[0].name : "")}</h1><p class="muted">gana «El vídeo bajo la lupa» con ${ord[0] ? ord[0].pts : 0} puntos</p></div>` + tarjetaClasificacion();
  }
  $("app").innerHTML = html + pie;

  const send = $("btnSend");
  if (send){
    document.querySelectorAll(".resp").forEach(t => t.oninput = guardarBorrador);
    send.onclick = enviar;
  }
  reloj();
}
function tarjetaPregunta(){
  const g = S.game, q = g.q;
  return `<div class="card" id="qcard"><div class="qmeta"><span class="tag">PREGUNTA ${q.n} DE ${q.total}</span><span class="clock" id="clock"></span></div>
    <div class="bloque">${esc(q.bloque)}</div><div class="qtext">${esc(q.q)}</div>
    ${g.pista ? `<div class="pista"><b>💡 PISTA</b>${esc(g.pista)}</div>` : ""}</div>`;
}
function tarjetaClasificacion(){
  const ord = [...S.teams].sort((a, b) => b.pts - a.pts);
  return `<div class="card"><h2>Clasificación</h2>${ord.map((t, i) => `<div class="st ${t.id === S.me.team ? "me" : ""}"><span>${i + 1}.</span><span>${esc(t.name)}</span><b>${t.pts}</b></div>`).join("")}</div>`;
}
function reloj(){
  const el = $("clock"); if (!el || !S || S.game.status !== "answer") return;
  const r = Math.max(0, Math.round((finTiempo - Date.now()) / 1000));
  el.textContent = Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0");
  el.classList.toggle("warn", r <= 60);
}
async function enviar(){
  if (ocupado) return;
  guardarBorrador();
  const vals = [...document.querySelectorAll(".resp")].map(t => t.value.trim());
  if (!vals.some(v => v)){ $("err").textContent = "Escribid algo antes de enviar"; return; }
  if (vals.some(v => !v) && !$("btnSend").dataset.ok){
    $("btnSend").dataset.ok = "1"; $("btnSend").textContent = "Hay casillas vacías · pulsa otra vez para enviar"; return;
  }
  ocupado = true; $("btnSend").disabled = true; $("btnSend").textContent = "Enviando…";
  try { await api({ a:"send", idx: S.game.idx, answers: vals }); vista = ""; }
  catch(e){ const el = $("err"); if (el) el.textContent = e.message; const b = $("btnSend"); if (b){ b.disabled = false; b.textContent = "Enviar respuesta"; } }
  ocupado = false; await refrescar();
}

if (unido && API) refrescar(); else pintarEntrada();
</script>
</body>
</html>

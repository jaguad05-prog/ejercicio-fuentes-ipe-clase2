<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>La Liguilla · Equipo</title>
<style>
:root{--ink:#10231A;--green:#0F6E56;--grass:#1a472a;--gold:#E8B54A;--red:#C8102E;--bg:#EEF3EF;--muted:#66706A;--border:#D5DDD7;--team:#0F6E56}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
.top{background:var(--grass);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.top .t1{font-size:14px;font-weight:800;letter-spacing:.04em}
.top .t2{font-size:11px;color:var(--gold);letter-spacing:.06em}
.chip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--team);border:2px solid #fff;flex:none;display:inline-block}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
h1{font-size:23px;line-height:1.2;margin-bottom:8px}
h2{font-size:19px;line-height:1.3;margin-bottom:12px}
p{line-height:1.45}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input{width:100%;border:2px solid var(--border);border-radius:10px;padding:13px;font-size:17px;font-family:inherit;color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--green)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:18px;font-weight:800;font-family:inherit;color:#fff;background:var(--green);cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.hidden{display:none!important}
.center{text-align:center}
.bigicon{font-size:52px;margin-bottom:8px}
.pulse{animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.35}}
/* marcador */
.board{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.board .jl{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:800;margin-bottom:6px;text-align:center}
.board .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.board .nm.r{justify-content:flex-end;text-align:right}
.board .sc{font-size:34px;font-weight:900;letter-spacing:.06em}
.board .sub{font-size:12px;color:#c8d3cc;text-align:center;margin-top:4px}
.rank{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.rank .rk{font-size:30px;font-weight:900;color:var(--green);min-width:52px;text-align:center}
.rank .rt{font-weight:800}
.rank .rs{font-size:13px;color:var(--muted)}
/* preguntas */
.qtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;padding:4px 10px;border-radius:20px;background:var(--ink);color:#fff;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;color:#fff;text-align:left;cursor:pointer;min-height:58px;display:flex;gap:10px;align-items:center}
.opt:nth-child(1){background:#C8102E}.opt:nth-child(2){background:#1565C0}.opt:nth-child(3){background:#B7791F}.opt:nth-child(4){background:#2E7D32}
.opt .s{font-size:20px;width:24px;text-align:center;flex:none}
.opt.dim{opacity:.3}.opt.right{outline:4px solid var(--ink);opacity:1}
.fb{border-radius:12px;padding:16px;text-align:center;color:#fff;font-weight:800;margin-top:12px}
.fb.ok{background:var(--green)}.fb.ko{background:var(--red)}
.fb .big{font-size:24px}.fb .sm{font-size:14px;font-weight:600;margin-top:4px}
/* penaltis */
.role{display:inline-block;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:800;margin-bottom:10px}
.role.s{background:#E1F5EE;color:#0F6E56}.role.k{background:#FAEEDA;color:#633806}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{border:2px solid #d8e0da;border-radius:14px;background:#f5f8f6;cursor:pointer;padding:18px 8px;text-align:center;font-size:14px;font-weight:700;color:#445;user-select:none}
.cell .arr{font-size:32px;display:block;margin-bottom:4px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.dots span{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18);font-size:11px;display:flex;align-items:center;justify-content:center}
.dots .g{background:#2ecc71}.dots .f{background:#e74c3c}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);font-size:11px;text-align:center;padding:6px 3px;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 3px;border-bottom:1px solid var(--border);text-align:center}
.tbl td.n{text-align:left;font-weight:700}
.tbl tr.me{background:#FFF7E0}
/* CAMPO */
#campo-wrap{position:relative;border-radius:14px;overflow:hidden;margin-bottom:1rem;line-height:0}
#campo-svg{display:block;width:100%;height:auto}
#result-overlay{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#result-overlay.show{opacity:1}
.ro-text{font-size:44px;font-weight:900;letter-spacing:.04em;text-shadow:0 3px 14px rgba(0,0,0,.85);white-space:nowrap}

/* ANIMACIONES BALÓN */
.ab-TL{animation:bTL .8s .2s cubic-bezier(.2,.8,.4,1) forwards}
.ab-TR{animation:bTR .8s .2s cubic-bezier(.2,.8,.4,1) forwards}
.ab-BL{animation:bBL .8s .2s cubic-bezier(.2,.8,.4,1) forwards}
.ab-BR{animation:bBR .8s .2s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes bTL{to{transform:translate(-104px,-162px) scale(.38)}}
@keyframes bTR{to{transform:translate(104px,-162px) scale(.38)}}
@keyframes bBL{to{transform:translate(-104px,-80px) scale(.5)}}
@keyframes bBR{to{transform:translate(104px,-80px) scale(.5)}}

/* ANIMACIONES PORTERO */
.ak-TL{animation:kTL .65s .1s ease-out forwards}
.ak-TR{animation:kTR .65s .1s ease-out forwards}
.ak-BL{animation:kBL .55s .1s ease-out forwards}
.ak-BR{animation:kBR .55s .1s ease-out forwards}
@keyframes kTL{to{transform:translate(-78px,-38px) rotate(-54deg)}}
@keyframes kTR{to{transform:translate(78px,-38px) rotate(54deg)}}
@keyframes kBL{to{transform:translate(-58px,20px) rotate(-24deg)}}
@keyframes kBR{to{transform:translate(58px,20px) rotate(24deg)}}

/* PATADA */
.ak2{animation:kick2 .45s .1s ease-out forwards}
@keyframes kick2{0%{transform:rotate(0deg)}45%{transform:rotate(-62deg)}100%{transform:rotate(-44deg)}}

</style>
</head>
<body>
<div class="top">
  <div><div class="t1">LA LIGUILLA</div><div class="t2" id="codeLbl">EQUIPO</div></div>
  <div class="chip hidden" id="teamChip"><span class="dot" id="teamDot"></span><span id="teamName"></span></div>
</div>
<div class="wrap">
  <section id="sJoin" class="card">
    <h1>Entrad en la liguilla</h1>
    <p class="muted">Un solo móvil u ordenador por equipo.</p>
    <label for="inCode">Código</label>
    <input id="inCode" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="Ej. KPRT" style="text-transform:uppercase;letter-spacing:.2em;font-weight:800">
    <label for="inName">Nombre del equipo</label>
    <input id="inName" maxlength="24" autocomplete="off" placeholder="Ej. Los Galácticos">
    <button class="btn" id="bJoin">Entrar</button>
    <div class="err" id="joinErr"></div>
  </section>

  <section id="sGame" class="hidden">
    <div class="rank" id="rankBox"><div class="rk" id="rankBig">–</div><div><div class="rt" id="rankTxt"></div><div class="rs" id="rankSub"></div></div></div>
    <div id="boardBox"></div>
    <div id="mainBox"></div>
    <div class="err" id="gameErr"></div>
  </section>
</div>

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function barajar(arr, seed){ const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Misma pregunta y mismo orden de opciones para los dos equipos del partido
function preguntaSemilla(seed, idx){
  const orden = barajar(BANCO.map((_, i) => i), seed);
  const q = BANCO[orden[idx % orden.length]];
  if (q.r) return { id:q.id, cat:q.cat, q:q.q, r:q.r, s:q.s };
  const perm = barajar([0,1,2,3].slice(0, q.o.length), seed + idx * 7919);
  return { id:q.id, cat:q.cat, q:q.q, o:perm.map(i => q.o[i]), c:perm.indexOf(q.c) };
}

function norm(s){
  return " " + String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9ñ]+/g," ").replace(/\b(el|la|los|las|the|un|una|de|del)\b/g," ")
    .replace(/\s+/g," ").trim() + " ";
}
// Acepta la respuesta exacta, dentro de una frase corta o con solo el apellido
function correctaCorta(resp, variantes){
  const r = norm(resp);
  if (r.trim().length === 0) return false;
  const rt = r.trim().split(" ");
  return variantes.some(v => {
    const n = norm(v); if (!n.trim()) return false;
    if (r === n || (r.includes(n) && r.length <= n.length + 22)) return true;
    const nt = n.trim().split(" ");
    return nt.length > 1 && rt.every(w => nt.includes(w)) && rt.includes(nt[nt.length - 1]);
  });
}

let API = API_URL || qs.get("api") || lsGet("liga_api", "");
async function api(p, tries){
  tries = tries || 3;
  for (let i = 0; i < tries; i++){
    try{
      const r = await fetch(API, { method:"POST", body: JSON.stringify(p) });
      const j = await r.json(); if (j.error) throw Object.assign(new Error(j.error), { server:true }); return j;
    }catch(e){ if (e.server || i === tries - 1) throw e; await new Promise(r => setTimeout(r, 700 * (i + 1))); }
  }
}

let S = { code:"", team:null };
let L = null, TEAMS = [], MATCHES = [];
let vista = "", ocupado = false;
let local = { key:"", step:"q", ans:null, shown:-1 };   // estado de la pantalla del partido

function nombre(id){ const t = TEAMS.find(x => x.id === id); return t ? t.name : "?"; }
function color(id){ const t = TEAMS.find(x => x.id === id); return t ? t.color : "#999"; }

// ── clasificación ──
function tabla(){
  const t = {}; TEAMS.forEach(e => t[e.id] = { id:e.id, name:e.name, color:e.color, pj:0, g:0, e:0, p:0, gf:0, gc:0, pts:0 });
  MATCHES.filter(m => m.closed && !m.final).forEach(m => {
    const A = t[m.a], B = t[m.b]; if (!A || !B) return;
    A.pj++; B.pj++; A.gf += m.sa; A.gc += m.sb; B.gf += m.sb; B.gc += m.sa;
    if (m.sa > m.sb){ A.g++; B.p++; A.pts += 3; } else if (m.sb > m.sa){ B.g++; A.p++; B.pts += 3; } else { A.e++; B.e++; A.pts++; B.pts++; }
  });
  const o = Object.values(t).sort((x, y) => (y.pts - x.pts) || ((y.gf - y.gc) - (x.gf - x.gc)) || (y.gf - x.gf) || x.name.localeCompare(y.name));
  // el ganador del desempate a penaltis pasa delante
  if (L && L.champ){ const i = o.findIndex(r => r.id === L.champ); if (i > 0) o.unshift(o.splice(i, 1)[0]); }
  return o;
}
function empateArriba(){ const o = tabla(); return L && !L.champ && o.length > 1 && o[0].pts === o[1].pts ? [o[0], o[1]] : null; }
function partidoFinal(){ return MATCHES.find(m => m.final) || null; }
function tablaHTML(){
  return "<table class='tbl'><thead><tr><th></th><th style='text-align:left'>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead><tbody>" +
    tabla().map((r, i) => "<tr class='" + (S.team && r.id === S.team.id ? "me" : "") + "'><td>" + (i+1) + "</td><td class='n'><span class='dot' style='background:" + r.color + ";border:none;width:10px;height:10px'></span> " + esc(r.name) + "</td><td>" + r.pj + "</td><td>" + r.g + "</td><td>" + r.e + "</td><td>" + r.p + "</td><td>" + (r.gf - r.gc) + "</td><td><b>" + r.pts + "</b></td></tr>").join("") + "</tbody></table>";
}
function pintarPuesto(){
  const tb = tabla(), i = tb.findIndex(r => r.id === S.team.id), yo = tb[i];
  $("rankBig").textContent = (i + 1) + "º";
  $("rankTxt").textContent = "Vais " + (i + 1) + "º de " + tb.length + " en la liguilla";
  $("rankSub").textContent = yo ? yo.pts + (yo.pts === 1 ? " punto" : " puntos") + " · " + yo.pj + " jugados" : "";
}

// ── partido actual ──
function miPartido(){
  if (!L || L.round < 0) return null;
  return MATCHES.find(m => m.r === L.round && (m.a === S.team.id || m.b === S.team.id)) || null;
}
function lado(m){ return m.a === S.team.id ? "a" : "b"; }
function rival(m){ return m.a === S.team.id ? m.b : m.a; }

function pintarMarcador(m){
  if (!m){ $("boardBox").innerHTML = ""; return; }
  const yo = lado(m), j = L.jor[m.r] || {};
  const tipo = { preguntas:"PREGUNTAS", penaltis:"PENALTIS", prueba:"PRUEBA" }[m.type];
  let sub = "";
  if (m.type === "preguntas") sub = "Vosotros " + m["i" + yo] + "/" + m.n + " · Rival " + m["i" + (yo === "a" ? "b" : "a")] + "/" + m.n;
  if (m.type === "penaltis"){
    const d = s => m.pen.shots.filter(x => x.s === s).map(x => "<span class='" + (x.goal ? "g" : "f") + "'>" + (x.goal ? "⚽" : "✗") + "</span>").join("");
    sub = "<div class='dots'>" + d(m.a === S.team.id ? "a" : "b") + "</div>";
  }
  if (m.closed) sub = "Partido terminado";
  $("boardBox").innerHTML = "<div class='board'><div class='jl'>" + (m.final ? "🏆 DESEMPATE POR EL TÍTULO · PENALTIS" : "JORNADA " + (m.r + 1) + " · " + tipo) + "</div><div class='row'>" +
    "<div class='nm'><span class='dot' style='background:" + color(m.a) + "'></span>" + esc(nombre(m.a)) + "</div>" +
    "<div class='sc'>" + m.sa + "–" + m.sb + "</div>" +
    "<div class='nm r'>" + esc(nombre(m.b)) + "<span class='dot' style='background:" + color(m.b) + "'></span></div></div>" +
    "<div class='sub'>" + sub + "</div></div>";
}

function pintar(){
  if (!L) return;
  pintarPuesto();
  const m = miPartido();
  const main = $("mainBox");
  if (L.status === "lobby"){
    $("boardBox").innerHTML = "";
    if (vista !== "lobby"){ vista = "lobby"; main.innerHTML = "<div class='card center'><div class='bigicon pulse'>🏟️</div><h2>Estáis dentro</h2><p class='muted'>Esperad a que la profesora haga el sorteo del calendario.</p></div>"; }
    return;
  }
  if (L.status === "over"){
    $("boardBox").innerHTML = "";
    const tb = tabla(), i = tb.findIndex(r => r.id === S.team.id), emp = empateArriba();
    vista = "over";
    const cab = emp ? "<div class='card center'><div class='bigicon'>⚖️</div><h2>Empate a puntos en cabeza</h2><p class='muted'>" + esc(emp[0].name) + " y " + esc(emp[1].name) + " se juegan el título en una tanda de penaltis. Esperad a que la profesora la ponga en marcha.</p></div>"
      : "<div class='card center'><div class='bigicon'>" + (i === 0 ? "🏆" : "🏁") + "</div><h2>" + (i === 0 ? "¡Campeones de la liguilla!" : "Liguilla terminada") + "</h2><p class='muted'>Termináis en el puesto " + (i + 1) + " de " + tb.length + ".</p></div>";
    main.innerHTML = cab + "<div class='card'>" + tablaHTML() + "</div>";
    return;
  }
  // entre jornadas
  if (!L.playing || !m){
    pintarMarcador(L.playing ? null : m);
    const sig = L.round + 1 < L.rounds.length ? L.rounds[L.round + 1].find(p => p.includes(S.team.id)) : null;
    let prox = "";
    const pf = L.status === "final" ? partidoFinal() : null;
    if (pf) prox = "<div class='card center'><div class='bigicon'>🏆</div><h2>Desempate por el título</h2><p class='muted'>" + esc(nombre(pf.a)) + " y " + esc(nombre(pf.b)) + " empataron a puntos y se juegan la liguilla a penaltis.</p><div style='font-size:44px;font-weight:900;margin-top:8px'>" + pf.sa + "–" + pf.sb + "</div></div>";
    else if (L.playing && !m) prox = "<div class='card center'><div class='bigicon'>☕</div><h2>Esta jornada descansáis</h2><p class='muted'>Aprovechad para mirar la clasificación.</p></div>";
    else if (sig){ const r = sig[0] === S.team.id ? sig[1] : sig[0]; prox = "<div class='card center'><p class='muted'>Próxima jornada</p><h2>" + (r ? "Contra " + esc(nombre(r)) : "Descansáis") + "</h2><p class='muted'>Esperad a que la profesora dé comienzo.</p></div>"; }
    const key = "espera" + L.round + (L.playing ? "p" : "") + (pf ? pf.sa + "-" + pf.sb : "") + JSON.stringify(tabla().map(r => r.pts)) + (sig ? sig.join() : "");
    if (vista !== key){ vista = key; main.innerHTML = prox + "<div class='card'><h2>Clasificación</h2>" + tablaHTML() + "</div>"; }
    return;
  }
  pintarMarcador(m);
  if (m.type === "preguntas") pintarPreguntas(m);
  else if (m.type === "penaltis") pintarPenaltis(m);
  else pintarPrueba(m);
}

// ── jornada de preguntas: cada acierto es un gol ──
function pintarPreguntas(m){
  const yo = lado(m), idx = m["i" + yo];
  const key = "q" + m.r + "_" + idx;
  if (idx >= m.n){
    if (vista !== key){ vista = key; $("mainBox").innerHTML = "<div class='card center'><div class='bigicon pulse'>⏳</div><h2>¡Terminado!</h2><p class='muted'>Esperad a que acabe el rival. El marcador de arriba se actualiza solo.</p></div>"; }
    return;
  }
  if (vista === key || ocupado) return;
  vista = key;
  const q = preguntaSemilla(L.seed + m.r * 101, m.r * m.n + idx);
  const sym = ["▲","◆","●","■"];
  const cab = "<div class='card'><span class='qtag'>PREGUNTA " + (idx + 1) + " DE " + m.n + " · " + esc(q.cat || "") + (q.r ? " · ESCRIBE" : "") + "</span><h2>" + esc(q.q) + "</h2>";
  if (q.r){
    $("mainBox").innerHTML = cab + "<input id='wIn' class='inp' autocomplete='off' placeholder='Escribe la respuesta' style='width:100%;font-size:20px;padding:12px;border-radius:12px;border:2px solid #ccc;box-sizing:border-box'>" +
      "<button id='wOk' class='btn' style='margin-top:10px;width:100%'>Responder</button><div id='fbq'></div></div>";
    const env = () => { const v = $("wIn").value; if (!v.trim()) return; responder(correctaCorta(v, q.r), q.s); };
    $("wOk").onclick = env; $("wIn").onkeydown = e => { if (e.key === "Enter") env(); };
    setTimeout(() => $("wIn") && $("wIn").focus(), 50);
  } else {
    $("mainBox").innerHTML = cab + "<div class='opts'>" +
      q.o.map((o, i) => "<button class='opt' data-i='" + i + "'><span class='s'>" + sym[i] + "</span><span>" + esc(o) + "</span></button>").join("") + "</div><div id='fbq'></div></div>";
    $("mainBox").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (ocupado) return;
      const i = +b.dataset.i;
      $("mainBox").querySelectorAll(".opt").forEach((x, j) => x.classList.add(j === q.c ? "right" : "dim"));
      responder(i === q.c, q.o[q.c]);
    });
  }
  async function responder(bien, sol){
    if (ocupado) return; ocupado = true;
    if ($("wOk")) { $("wOk").disabled = true; $("wIn").disabled = true; }
    $("fbq").innerHTML = "<div class='fb " + (bien ? "ok" : "ko") + "'><div class='big'>" + (bien ? "⚽ ¡Gol!" : "✗ Fallo") + "</div>" + (bien ? "" : "<div class='sm'>Era: " + esc(sol) + "</div>") + "</div>";
    try{ const r = await api({ a:"ans", c:S.code, t:S.team.id, r:m.r, i:m.i, q:idx, ok: bien ? 1 : 0 }, 4); actualizaPartido(r.match); }
    catch(e){ $("gameErr").textContent = "Problema de conexión, seguid."; }
    await new Promise(r => setTimeout(r, bien ? 700 : 1600));
    ocupado = false; pintar();
  }
}

// ── jornada de penaltis ──
const DIRS = [{id:"TL",label:"Arriba izquierda",arrow:"↖"},{id:"TR",label:"Arriba derecha",arrow:"↗"},{id:"BL",label:"Abajo izquierda",arrow:"↙"},{id:"BR",label:"Abajo derecha",arrow:"↘"}];
function lanzadorDe(m, k){ const f = m.pen.first; return k % 2 === 0 ? f : (f === "a" ? "b" : "a"); }
function pintarPenaltis(m){
  const yo = lado(m), k = m.pen.k;
  // primero se enseña el último tiro, si no se ha visto
  const ult = m.pen.shots[m.pen.shots.length - 1];
  const vistoKey = "penvisto_" + S.code + "_" + m.r;
  const visto = lsGet(vistoKey, -1);
  if (ult && ult.k > visto){
    if (vista === "anim" + ult.k) return;
    vista = "anim" + ult.k; ocupado = true;
    const miTiro = ult.s === yo;
    const txt = ult.goal ? (miTiro ? "¡Gol vuestro!" : "Gol del rival") : (miTiro ? "Os la han parado" : "¡Parada vuestra!");
    $("mainBox").innerHTML = "<div class='card'>" + campo(ult.shoot, ult.keep, ult.goal, true) +
      "<p class='center' style='font-weight:800;font-size:18px'>" + txt + "</p></div>";
    setTimeout(() => { const o = document.getElementById("result-overlay"); if (o) o.classList.add("show"); }, 1000);
    setTimeout(() => { lsSet(vistoKey, ult.k); ocupado = false; vista = ""; pintar(); }, 3600);
    return;
  }
  if (m.closed){
    const gano = m["s" + yo] > m["s" + (yo === "a" ? "b" : "a")];
    const key = "penfin" + m.r; if (vista === key) return; vista = key;
    $("mainBox").innerHTML = "<div class='card center'><div class='bigicon'>" + (gano ? "🏆" : "🧤") + "</div><h2>" + (gano ? "¡Ganáis la tanda!" : "Perdéis la tanda") + "</h2><p class='muted'>Esperad a la siguiente jornada.</p></div>";
    return;
  }
  const soyLanzador = lanzadorDe(m, k) === yo;
  if (m.pen.pick[yo]){
    const key = "penesp" + k; if (vista === key) return; vista = key;
    $("mainBox").innerHTML = "<div class='card center'><div class='bigicon pulse'>⏳</div><h2>Elección guardada</h2><p class='muted'>Esperando al rival…</p></div>";
    return;
  }
  const key = "pen" + m.r + "_" + k;
  if (local.key !== key){ local = { key, step:"dir", ans:false }; }
  const vkey = key + local.step;
  if (vista === vkey || ocupado) return;
  vista = vkey;
  const rol = soyLanzador ? "<span class='role s'>⚽ Lanzáis</span>" : "<span class='role k'>🧤 Paráis</span>";
  const numTiro = "Penalti " + (Math.floor(k / 2) + 1) + (k >= 10 ? " · muerte súbita" : "");
  if (local.step === "q"){
    const q = preguntaSemilla(L.seed + 5000 + m.r * 101 + m.i * 13, k);
    const sym = ["▲","◆","●","■"];
    $("mainBox").innerHTML = "<div class='card'>" + rol + " <span class='muted'>" + numTiro + "</span>" +
      "<p class='muted' style='margin:6px 0 12px'>" + (soyLanzador ? "Si acertáis, el portero no podrá estirarse." : "Si acertáis y el lanzador falla, os estiráis y cubrís todo vuestro lado.") + "</p>" +
      "<h2>" + esc(q.q) + "</h2><div class='opts'>" + q.o.map((o, i) => "<button class='opt' data-i='" + i + "'><span class='s'>" + sym[i] + "</span><span>" + esc(o) + "</span></button>").join("") + "</div><div id='fbq'></div></div>";
    $("mainBox").querySelectorAll(".opt").forEach(b => b.onclick = async () => {
      if (ocupado) return; ocupado = true;
      const bien = +b.dataset.i === q.c;
      $("mainBox").querySelectorAll(".opt").forEach((x, j) => x.classList.add(j === q.c ? "right" : "dim"));
      $("fbq").innerHTML = "<div class='fb " + (bien ? "ok" : "ko") + "'><div class='big'>" + (bien ? "✓ Acierto" : "✗ Fallo") + "</div></div>";
      await new Promise(r => setTimeout(r, 1200));
      local.ans = bien; local.step = "dir"; ocupado = false; vista = ""; pintar();
    });
  } else {
    $("mainBox").innerHTML = "<div class='card'>" + rol + " <span class='muted'>" + numTiro + "</span><h2 style='margin-top:8px'>" + (soyLanzador ? "¿A qué esquina disparáis?" : "¿A qué lado os tiráis?") + "</h2><div class='grid4'>" +
      DIRS.map(d => "<div class='cell' data-d='" + d.id + "'><span class='arr'>" + d.arrow + "</span>" + d.label + "</div>").join("") + "</div></div>";
    $("mainBox").querySelectorAll(".cell").forEach(c => c.onclick = async () => {
      if (ocupado) return; ocupado = true;
      try{ const r = await api({ a:"pen", c:S.code, t:S.team.id, r:m.r, i:m.i, k, ok: local.ans ? 1 : 0, dir:c.dataset.d }, 4); actualizaPartido(r.match); }
      catch(e){ $("gameErr").textContent = e.message || "Problema de conexión, volved a elegir."; }
      ocupado = false; vista = ""; pintar();
    });
  }
}

// ── jornada de prueba: los dos equipos apuntan el resultado y, si coincide, vale ──
function pintarPrueba(m){
  const j = L.jor[m.r] || {}, yo = lado(m), otro = yo === "a" ? "b" : "a";
  const mio = m.rep && m.rep[yo], suyo = m.rep && m.rep[otro];
  const estado = m.closed ? "c" : m.conflict ? "x" : mio ? "e" : "f";
  const key = "prueba" + m.r + estado + (mio ? mio.sa + "-" + mio.sb : "");
  if (vista === key || ocupado) return; vista = key;
  let h = "<div class='card'><span class='qtag' style='background:var(--gold);color:var(--ink)'>PRUEBA</span><p style='font-size:17px;font-weight:700;line-height:1.45'>" + esc(j.task || "Atentos a la profesora.") + "</p></div>";
  if (m.closed) h += "<div class='card center'><div class='bigicon'>✅</div><h2>Resultado guardado</h2><p class='muted'>Lo tenéis en el marcador de arriba.</p></div>";
  else if (estado === "e") h += "<div class='card center'><div class='bigicon pulse'>⏳</div><h2>Resultado enviado</h2><p class='muted'>Esperando a que " + esc(nombre(rival(m))) + " apunte el suyo. Si coincide, vale.</p></div>";
  else {
    const prev = mio ? (yo === "a" ? [mio.sa, mio.sb] : [mio.sb, mio.sa]) : [0, 0];
    h += "<div class='card'>" + (estado === "x" ? "<p style='color:var(--red);font-weight:800;margin-bottom:10px'>⚠️ No coincide con lo que ha apuntado " + esc(nombre(rival(m))) + ". Poneos de acuerdo y volved a enviarlo, o llamad a la profesora.</p>" : "") +
      "<h2>¿Cómo ha quedado?</h2><label>" + esc(S.team.name) + " (vosotros)</label><input id='rNos' type='number' min='0' max='99' value='" + prev[0] + "' inputmode='numeric'>" +
      "<label>" + esc(nombre(rival(m))) + "</label><input id='rEllos' type='number' min='0' max='99' value='" + prev[1] + "' inputmode='numeric'>" +
      "<button class='btn' id='bRep'>Enviar resultado</button></div>";
  }
  $("mainBox").innerHTML = h;
  const b = $("bRep");
  if (b) b.onclick = async () => {
    ocupado = true; b.disabled = true;
    try{ const r = await api({ a:"rep", c:S.code, t:S.team.id, r:m.r, i:m.i, nos:+$("rNos").value || 0, ellos:+$("rEllos").value || 0 }, 4); actualizaPartido(r.match); }
    catch(e){ $("gameErr").textContent = e.message || "No se ha podido enviar."; }
    ocupado = false; vista = ""; pintar();
  };
}

function actualizaPartido(m){ if (!m) return; const i = MATCHES.findIndex(x => x.r === m.r && x.i === m.i); if (i >= 0) MATCHES[i] = m; else MATCHES.push(m); }

// ── sondeo ──
async function sondeo(){
  try{
    const r = await fetch(API, { method:"POST", body: JSON.stringify({ a:"state", c:S.code }) });
    const st = await r.json(); if (st.error) throw new Error(st.error);
    L = st.league; TEAMS = st.teams; MATCHES = st.matches;
    $("gameErr").textContent = "";
    if (!ocupado) pintar(); else pintarMarcador(miPartido());
  }catch(e){ }
}
function bucle(){ setTimeout(async () => { await sondeo(); bucle(); }, L && L.playing ? 1800 : 3000); }

async function entrar(){
  const code = $("inCode").value.toUpperCase().replace(/[^A-Z]/g, ""), name = $("inName").value.trim();
  if (!API){ $("joinErr").textContent = "Falta la dirección del servidor. Pedídsela a la profesora."; return; }
  if (!code || !name){ $("joinErr").textContent = "Escribid el código y el nombre del equipo."; return; }
  lsSet("liga_api", API);
  $("bJoin").disabled = true; $("joinErr").textContent = "";
  try{
    S.code = code;
    const r = await api({ a:"join", c:code, name });
    S.team = r.team; lsSet("liga_ses_" + code, { team:r.team });
    document.documentElement.style.setProperty("--team", r.team.color);
    $("teamDot").style.background = r.team.color; $("teamName").textContent = r.team.name;
    $("teamChip").classList.remove("hidden"); $("codeLbl").textContent = "LIGUILLA " + code;
    $("sJoin").classList.add("hidden"); $("sGame").classList.remove("hidden");
    await sondeo(); bucle();
  }catch(e){ $("joinErr").textContent = e.message || "No se ha podido conectar."; $("bJoin").disabled = false; }
}
$("bJoin").onclick = entrar;
$("inName").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
(function init(){
  const c = (qs.get("c") || "").toUpperCase();
  if (c){ $("inCode").value = c; const prev = lsGet("liga_ses_" + c, null); if (prev && prev.team && API){ $("inName").value = prev.team.name; entrar(); } }
})();
